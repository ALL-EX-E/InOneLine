<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In one line — Auction lots</title>
<style>
:root {
  --font-family: "Segoe UI", Arial, sans-serif;
  --font-size: 24px;
  --font-color: #FFFFFF;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}
body {
  font-family: var(--font-family);
  font-size: var(--font-size);
  color: var(--font-color);
}
#background, #background-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: none;
}
#background {
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
#background-video {
  object-fit: cover;
  pointer-events: none;
}
#root {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header-shell {
  flex: 0 0 auto;
  width: 100%;
  overflow: hidden;
}
#viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
#lots-table {
  transform: translateY(0);
  will-change: transform;
}
th {
  font-weight: 700;
  text-align: center;
  border-bottom: 1px solid currentColor;
}
th, td {
  padding: .48em .65em;
  vertical-align: middle;
}
tbody tr { background: transparent; }
td { border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
th:not(:last-child),
td:not(:last-child) {
  border-right: 1px solid color-mix(in srgb, currentColor 24%, transparent);
}
.col-pos,
.col-chance,
.col-points {
  text-align: center;
  white-space: nowrap;
  padding-left: .45em;
  padding-right: .45em;
}
.col-title {
  min-width: 0;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#empty {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: .72;
}
#measure-cell {
  position: fixed;
  left: -10000px;
  top: -10000px;
  display: inline-block;
  visibility: hidden;
  pointer-events: none;
  white-space: nowrap;
}
#api-state {
  display: none;
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  padding: 6px 10px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  color: #fff;
  font: 14px "Segoe UI", sans-serif;
}
body.preview #api-state.visible { display: block; }
</style>
</head>
<body>
<div id="background"></div>
<video id="background-video" autoplay muted loop playsinline></video>
<div id="root">
  <div id="header-shell">
    <table id="header-table">
      <colgroup id="header-cols"></colgroup>
      <thead><tr id="header-row"></tr></thead>
    </table>
  </div>
  <div id="viewport">
    <table id="lots-table">
      <colgroup id="body-cols"></colgroup>
      <tbody id="body"></tbody>
    </table>
    <div id="empty">Список лотов пуст</div>
  </div>
</div>
<span id="measure-cell" aria-hidden="true"></span>
<div id="api-state">Нет связи с In one line</div>
<script>
(() => {
  "use strict";
  const API = "/api/auction-lots";
  const POLL_MS = 200;
  const SPEED_PX_PER_SECOND = 25;
  const preview = new URLSearchParams(location.search).get("preview") === "1";
  if (preview) document.body.classList.add("preview");

  const headerShell = document.getElementById("header-shell");
  const headerCols = document.getElementById("header-cols");
  const headerRow = document.getElementById("header-row");
  const viewport = document.getElementById("viewport");
  const bodyCols = document.getElementById("body-cols");
  const table = document.getElementById("lots-table");
  const body = document.getElementById("body");
  const empty = document.getElementById("empty");
  const measureCell = document.getElementById("measure-cell");
  const apiState = document.getElementById("api-state");
  const background = document.getElementById("background");
  const backgroundVideo = document.getElementById("background-video");

  let lastRowsSignature = "";
  let lastPresentationSignature = "";
  let currentRows = [];
  let currentShowChance = false;
  let currentPositionMode = "position";
  let autoScroll = false;
  let direction = 1;
  let scrollY = 0;
  let lastFrame = performance.now();
  let layoutFrameId = null;
  const measureCache = new Map();

  function addCell(row, text, className, header = false) {
    const cell = document.createElement(header ? "th" : "td");
    cell.className = className;
    cell.textContent = String(text ?? "");
    row.appendChild(cell);
  }

  function buildColumnGroup(target, widths, showChance, positionMode) {
    const fragment = document.createDocumentFragment();
    const positionWidths = positionMode === "start_current"
      ? [widths.start, widths.current]
      : [widths.position];
    const ordered = [
      ...positionWidths,
      null,
      ...(showChance ? [widths.chance] : []),
      widths.points,
    ];
    for (const width of ordered) {
      const col = document.createElement("col");
      if (Number.isFinite(width)) col.style.width = Math.ceil(width) + "px";
      fragment.appendChild(col);
    }
    target.replaceChildren(fragment);
  }

  function measureText(text, className, bold) {
    const key = [
      getComputedStyle(document.body).fontFamily,
      getComputedStyle(document.body).fontSize,
      className,
      bold ? "700" : "400",
      String(text ?? ""),
    ].join("\u0000");
    const cached = measureCache.get(key);
    if (cached !== undefined) return cached;

    measureCell.className = className;
    measureCell.style.fontWeight = bold ? "700" : "400";
    measureCell.textContent = String(text ?? "");
    const width = Math.ceil(measureCell.getBoundingClientRect().width) + 2;
    measureCache.set(key, width);
    return width;
  }

  function maxMeasured(rows, valueGetter, className, headerText) {
    let width = measureText(headerText, className, true);
    for (const row of rows) {
      width = Math.max(
        width,
        measureText(valueGetter(row), className, false)
      );
    }
    return width;
  }

  function syncColumnWidths() {
    layoutFrameId = null;
    if (!currentRows.length) return;

    const widths = {
      position: maxMeasured(
        currentRows,
        row => row.current_position,
        "col-pos",
        "ПОЗИЦИЯ"
      ),
      start: maxMeasured(
        currentRows,
        row => row.start_position,
        "col-pos",
        "СТАРТ"
      ),
      current: maxMeasured(
        currentRows,
        row => row.current_position,
        "col-pos",
        "ТЕКУЩАЯ"
      ),
      chance: currentShowChance
        ? maxMeasured(
            currentRows,
            row => row.chance_text,
            "col-chance",
            "ШАНС В КОЛЕСЕ"
          )
        : null,
      points: maxMeasured(
        currentRows,
        row => row.points_text,
        "col-points",
        "БАЛЛЫ"
      ),
    };

    buildColumnGroup(
      headerCols,
      widths,
      currentShowChance,
      currentPositionMode
    );
    buildColumnGroup(
      bodyCols,
      widths,
      currentShowChance,
      currentPositionMode
    );
    clampScroll();
  }

  function scheduleColumnSync() {
    if (layoutFrameId !== null) cancelAnimationFrame(layoutFrameId);
    layoutFrameId = requestAnimationFrame(syncColumnWidths);
  }

  function renderRows(payload) {
    const rows = Array.isArray(payload.rows) ? payload.rows : [];
    const showChance = Boolean(payload.show_wheel_chance);
    const positionMode = payload.position_columns === "start_current"
      ? "start_current"
      : "position";
    const signature = JSON.stringify([showChance, positionMode, rows]);
    if (signature === lastRowsSignature) return false;
    lastRowsSignature = signature;
    currentRows = rows;
    currentShowChance = showChance;
    currentPositionMode = positionMode;

    headerRow.replaceChildren();
    if (positionMode === "start_current") {
      addCell(headerRow, "СТАРТ", "col-pos", true);
      addCell(headerRow, "ТЕКУЩАЯ", "col-pos", true);
    } else {
      addCell(headerRow, "ПОЗИЦИЯ", "col-pos", true);
    }
    addCell(headerRow, "НАЗВАНИЕ", "col-title", true);
    if (showChance) {
      addCell(headerRow, "ШАНС В КОЛЕСЕ", "col-chance", true);
    }
    addCell(headerRow, "БАЛЛЫ", "col-points", true);

    const fragment = document.createDocumentFragment();
    for (const item of rows) {
      const tr = document.createElement("tr");
      if (positionMode === "start_current") {
        addCell(tr, item.start_position, "col-pos");
        addCell(tr, item.current_position, "col-pos");
      } else {
        addCell(tr, item.current_position, "col-pos");
      }
      addCell(tr, item.title, "col-title");
      if (showChance) addCell(tr, item.chance_text, "col-chance");
      addCell(tr, item.points_text, "col-points");
      fragment.appendChild(tr);
    }
    body.replaceChildren(fragment);

    const hasRows = rows.length > 0;
    headerShell.style.display = hasRows ? "block" : "none";
    table.style.display = hasRows ? "table" : "none";
    empty.style.display = hasRows ? "none" : "flex";
    scheduleColumnSync();
    return true;
  }

  function clearMediaBackground() {
    background.style.display = "none";
    background.style.backgroundImage = "";
    if (!backgroundVideo.paused) backgroundVideo.pause();
    backgroundVideo.removeAttribute("src");
    backgroundVideo.load();
    backgroundVideo.style.display = "none";
  }

  function applyPresentation(presentation) {
    const p = presentation || {};
    const signature = JSON.stringify(p);
    if (signature === lastPresentationSignature) return false;
    lastPresentationSignature = signature;

    document.documentElement.style.setProperty(
      "--font-family",
      JSON.stringify(String(p.font_family || "Segoe UI"))
    );
    document.documentElement.style.setProperty(
      "--font-size",
      Math.max(8, Number(p.font_size) || 24) + "px"
    );
    document.documentElement.style.setProperty(
      "--font-color",
      String(p.font_color || "#FFFFFF")
    );
    measureCache.clear();

    const mode = String(p.background || "transparent");
    document.body.style.backgroundColor =
      mode === "color" ? String(p.background_color || "#000000") : "transparent";
    clearMediaBackground();

    const media = p.background_media || {};
    if (mode === "media" && media.available && media.url) {
      if (String(media.type || "") === "video") {
        backgroundVideo.src = String(media.url);
        backgroundVideo.style.display = "block";
        backgroundVideo.play().catch(() => {});
      } else {
        background.style.backgroundImage =
          'url("' + String(media.url).replace(/"/g, "%22") + '")';
        background.style.display = "block";
      }
    }
    scheduleColumnSync();
    return true;
  }

  function maximumScroll() {
    return Math.max(0, table.scrollHeight - viewport.clientHeight);
  }

  function applyScroll() {
    table.style.transform = `translateY(${-scrollY}px)`;
  }

  function clampScroll() {
    const maximum = maximumScroll();
    scrollY = Math.max(0, Math.min(scrollY, maximum));
    if (maximum <= 0) direction = 1;
    applyScroll();
  }

  function applyPayload(payload) {
    renderRows(payload || {});
    applyPresentation((payload || {}).presentation || {});
    const nextAutoScroll = Boolean((payload || {}).auto_scroll);
    if (nextAutoScroll !== autoScroll) {
      autoScroll = nextAutoScroll;
      const maximum = maximumScroll();
      direction = scrollY >= maximum - 1 && maximum > 0 ? -1 : 1;
      lastFrame = performance.now();
    }
  }

  function scrollFrame(now) {
    const dt = Math.min(100, Math.max(0, now - lastFrame));
    lastFrame = now;
    if (autoScroll) {
      const maximum = maximumScroll();
      if (maximum > 0) {
        scrollY += direction * SPEED_PX_PER_SECOND * dt / 1000;
        if (scrollY >= maximum) {
          scrollY = maximum;
          direction = -1;
        } else if (scrollY <= 0) {
          scrollY = 0;
          direction = 1;
        }
        applyScroll();
      } else if (scrollY !== 0) {
        scrollY = 0;
        applyScroll();
      }
    }
    requestAnimationFrame(scrollFrame);
  }

  async function update() {
    try {
      const response = await fetch(API, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      applyPayload(await response.json());
      apiState.classList.remove("visible");
    } catch (_error) {
      apiState.classList.add("visible");
    }
  }

  new ResizeObserver(() => {
    scheduleColumnSync();
    clampScroll();
  }).observe(viewport);

  setInterval(update, POLL_MS);
  requestAnimationFrame(scrollFrame);
  update();
})();
</script>
</body>
</html>
