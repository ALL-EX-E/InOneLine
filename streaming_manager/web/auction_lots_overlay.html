<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In one line — Auction lots</title>
<style>
:root {
  --font-family: "Segoe UI", Arial, sans-serif;
  --font-size: 24px;
  --font-color: #FFFFFF;
  /* P14-A/UI-047: glass outer panel + independently rounded list cells,
     matching the accepted list-overlay principles without a table grid. */
  --lot-panel-bg: rgba(10, 13, 16, .74);
  --lot-cell-bg: rgba(24, 40, 52, .76);
  --lot-header-bg: rgba(36, 64, 84, .94);
  --lot-border: rgba(255, 255, 255, .8);
  --lot-glow: rgba(175, 219, 248, .45);
  --lot-panel-border: rgba(255,255,255,.8);
  --lot-row-border: rgba(255,255,255,.8);
  --lot-panel-glow: rgba(255,255,255,.45);
  --lot-row-glow: rgba(255,255,255,.45);
  --lot-header-font-family: "Segoe UI", Arial, sans-serif;
  --lot-header-font-size: 24px;
  --lot-header-font-color: #FFFFFF;
  --lot-columns: minmax(0, 1fr);
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}
body {
  font-family: var(--font-family);
  font-size: var(--font-size);
  color: var(--font-color);
  /* Give the existing border and 14px glow space inside OBS Browser Source. */
  padding: 16px;
}
#background, #background-video {
  /* These elements are children of the rounded card, never of the viewport. */
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: none;
}
#background {
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
#background-video {
  object-fit: cover;
  pointer-events: none;
}
#root {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 10px 9px;
  background: transparent;
  isolation: isolate;
  border: 1px solid var(--lot-panel-border);
  box-shadow: 0 0 6px var(--lot-panel-glow), 0 0 14px var(--lot-panel-glow),
    inset 0 0 8px rgba(255, 255, 255, .12);
  border-radius: 8px;
}
/* Tint the chosen image/video/color inside the card, not over its glow.
   Outer 16px source inset remains truly transparent in every background mode. */
#root::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: var(--lot-panel-bg);
}
#header-shell {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  width: 100%;
  overflow: hidden;
  padding-bottom: 9px;
}
#viewport {
  position: relative;
  z-index: 2;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow: hidden;
}
#total-footer {
  position: relative;
  z-index: 2;
  display: none;
  flex: 0 0 auto;
  margin-top: 9px;
  padding: .45em .58em;
  border: 1px solid var(--lot-row-border);
  border-radius: 6px;
  background: var(--lot-cell-bg);
  box-shadow: 0 0 5px var(--lot-row-glow), inset 0 0 4px rgba(255,255,255,.06);
  font-weight: 700;
  text-align: center;
}
#lots-rows {
  width: 100%;
  display: flex;
  flex-direction: column;
  transform: translateY(0);
  will-change: transform;
}
#header-row, .lot-row {
  width: 100%;
  display: grid;
  grid-template-columns: var(--lot-columns);
  gap: 8px;
  min-width: 0;
}
.lot-row { padding-bottom: 9px; }
.lot-cell {
  min-width: 0;
  padding: .45em .58em;
  text-align: center;
  border: 1px solid var(--lot-row-border);
  border-radius: 6px;
  background: var(--lot-cell-bg);
  box-shadow: 0 0 5px var(--lot-row-glow), inset 0 0 4px rgba(255,255,255,.06);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lot-header {
  background: var(--lot-header-bg);
  font-family: var(--lot-header-font-family);
  font-size: var(--lot-header-font-size);
  color: var(--lot-header-font-color);
  font-weight: 700;
}
.col-pos, .col-chance, .col-points {
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.col-title {
  text-align: left;
  overflow: visible;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}
#empty {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: .72;
}
#measure-cell {
  position: fixed;
  left: -10000px;
  top: -10000px;
  display: inline-block;
  visibility: hidden;
  pointer-events: none;
  white-space: nowrap;
}
#api-state {
  display: none;
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  padding: 6px 10px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  color: #fff;
  font: 14px "Segoe UI", sans-serif;
}
body.preview #api-state.visible { display: block; }
</style>
<script src="/obs-visibility.js"></script>
</head>
<body>
<div id="root">
  <div id="background"></div>
  <video id="background-video" autoplay muted loop playsinline></video>
  <div id="header-shell">
    <div id="header-row" class="lot-row" role="row"></div>
  </div>
  <div id="viewport">
    <div id="lots-rows" role="rowgroup"></div>
    <div id="empty">Список лотов пуст</div>
  </div>
  <div id="total-footer" role="status" aria-live="polite"></div>
</div>
<span id="measure-cell" aria-hidden="true"></span>
<div id="api-state">Нет связи с In one line</div>
<script>
(() => {
  "use strict";
  const API = "/api/auction-lots";
  const POLL_MS = 200;
  const SPEED_PX_PER_SECOND = 25;
  const preview = ObsVisibility.preview;
  if (preview) document.body.classList.add("preview");

  const headerShell = document.getElementById("header-shell");
  const headerRow = document.getElementById("header-row");
  const viewport = document.getElementById("viewport");
  const table = document.getElementById("lots-rows");
  const body = table;
  const empty = document.getElementById("empty");
  const measureCell = document.getElementById("measure-cell");
  const apiState = document.getElementById("api-state");
  const background = document.getElementById("background");
  const backgroundVideo = document.getElementById("background-video");
  const totalFooter = document.getElementById("total-footer");

  let lastRowsSignature = "";
  let lastPresentationSignature = "";
  let currentRows = [];
  let currentShowChance = false;
  let currentPositionMode = "position";
  let autoScroll = false;
  let direction = 1;
  let scrollY = 0;
  let lastFrame = performance.now();
  let layoutFrameId = null;
  const measureCache = new Map();

  function addCell(row, text, className, header = false) {
    const cell = document.createElement("div");
    cell.className = className + " lot-cell" + (header ? " lot-header" : "");
    cell.textContent = String(text ?? "");
    cell.setAttribute("role", header ? "columnheader" : "cell");
    row.appendChild(cell);
  }

  function gridColumns(widths, showChance, positionMode) {
    // Preserve existing size-to-content position/chance/points policy.
    // Title consumes the remaining width, same as the old table colgroup.
    const positionWidths = positionMode === "start_current"
      ? [widths.start, widths.current]
      : [widths.position];
    const ordered = [
      ...positionWidths,
      null,
      ...(showChance ? [widths.chance] : []),
      widths.points,
    ];
    return ordered.map(width =>
      Number.isFinite(width) ? Math.ceil(width) + "px" : "minmax(0, 1fr)"
    ).join(" ");
  }

  function measureText(text, className, bold) {
    const key = [
      bold ? getComputedStyle(document.documentElement).getPropertyValue("--lot-header-font-family") : getComputedStyle(document.body).fontFamily,
      bold ? getComputedStyle(document.documentElement).getPropertyValue("--lot-header-font-size") : getComputedStyle(document.body).fontSize,
      className,
      bold ? "700" : "400",
      String(text ?? ""),
    ].join("\u0000");
    const cached = measureCache.get(key);
    if (cached !== undefined) return cached;

    measureCell.className = className;
    measureCell.style.fontWeight = bold ? "700" : "400";
    measureCell.style.fontFamily = bold
      ? getComputedStyle(document.documentElement).getPropertyValue("--lot-header-font-family").trim()
      : "var(--font-family)";
    measureCell.style.fontSize = bold
      ? getComputedStyle(document.documentElement).getPropertyValue("--lot-header-font-size").trim()
      : "var(--font-size)";
    measureCell.textContent = String(text ?? "");
    // Reserve cell padding, border and glow spacing for each auto column.
    const width = Math.ceil(measureCell.getBoundingClientRect().width)
      + Math.ceil(parseFloat(getComputedStyle(document.body).fontSize) * 1.2) + 10;
    measureCache.set(key, width);
    return width;
  }

  function maxMeasured(rows, valueGetter, className, headerText) {
    let width = measureText(headerText, className, true);
    for (const row of rows) {
      width = Math.max(
        width,
        measureText(valueGetter(row), className, false)
      );
    }
    return width;
  }

  function syncColumnWidths() {
    layoutFrameId = null;
    if (!currentRows.length) return;

    const widths = {
      position: maxMeasured(
        currentRows,
        row => row.current_position,
        "col-pos",
        "ПОЗИЦИЯ"
      ),
      start: maxMeasured(
        currentRows,
        row => row.start_position,
        "col-pos",
        "СТАРТ"
      ),
      current: maxMeasured(
        currentRows,
        row => row.current_position,
        "col-pos",
        "ТЕКУЩАЯ"
      ),
      chance: currentShowChance
        ? maxMeasured(
            currentRows,
            row => row.chance_text,
            "col-chance",
            "ШАНС В КОЛЕСЕ"
          )
        : null,
      points: maxMeasured(
        currentRows,
        row => row.points_text,
        "col-points",
        "БАЛЛЫ"
      ),
    };

    document.getElementById("root").style.setProperty(
      "--lot-columns",
      gridColumns(widths, currentShowChance, currentPositionMode)
    );
    clampScroll();
  }

  function scheduleColumnSync() {
    if (layoutFrameId !== null) cancelAnimationFrame(layoutFrameId);
    layoutFrameId = requestAnimationFrame(syncColumnWidths);
  }

  function renderRows(payload) {
    const rows = Array.isArray(payload.rows) ? payload.rows : [];
    const showChance = Boolean(payload.show_wheel_chance);
    const positionMode = payload.position_columns === "start_current"
      ? "start_current"
      : "position";
    const signature = JSON.stringify([showChance, positionMode, rows]);
    if (signature === lastRowsSignature) return false;
    lastRowsSignature = signature;
    currentRows = rows;
    currentShowChance = showChance;
    currentPositionMode = positionMode;

    headerRow.replaceChildren();
    if (positionMode === "start_current") {
      addCell(headerRow, "СТАРТ", "col-pos", true);
      addCell(headerRow, "ТЕКУЩАЯ", "col-pos", true);
    } else {
      addCell(headerRow, "ПОЗИЦИЯ", "col-pos", true);
    }
    addCell(headerRow, "НАЗВАНИЕ", "col-title", true);
    if (showChance) {
      addCell(headerRow, "ШАНС В КОЛЕСЕ", "col-chance", true);
    }
    addCell(headerRow, "БАЛЛЫ", "col-points", true);

    const fragment = document.createDocumentFragment();
    for (const item of rows) {
      const tr = document.createElement("div");
      tr.className = "lot-row";
      tr.setAttribute("role", "row");
      if (positionMode === "start_current") {
        addCell(tr, item.start_position, "col-pos");
        addCell(tr, item.current_position, "col-pos");
      } else {
        addCell(tr, item.current_position, "col-pos");
      }
      addCell(tr, item.title, "col-title");
      if (showChance) addCell(tr, item.chance_text, "col-chance");
      addCell(tr, item.points_text, "col-points");
      fragment.appendChild(tr);
    }
    body.replaceChildren(fragment);

    const hasRows = rows.length > 0;
    headerShell.style.display = hasRows ? "block" : "none";
    table.style.display = hasRows ? "flex" : "none";
    empty.style.display = hasRows ? "none" : "flex";
    scheduleColumnSync();
    return true;
  }

  function clearMediaBackground() {
    background.style.display = "none";
    background.style.backgroundImage = "";
    background.style.backgroundColor = "transparent";
    if (!backgroundVideo.paused) backgroundVideo.pause();
    backgroundVideo.removeAttribute("src");
    backgroundVideo.load();
    backgroundVideo.style.display = "none";
  }

  function applyPresentation(presentation) {
    const p = presentation || {};
    const signature = JSON.stringify(p);
    if (signature === lastPresentationSignature) return false;
    lastPresentationSignature = signature;

    document.documentElement.style.setProperty(
      "--font-family",
      JSON.stringify(String(p.font_family || "Segoe UI"))
    );
    document.documentElement.style.setProperty(
      "--font-size",
      Math.max(8, Number(p.font_size) || 24) + "px"
    );
    document.documentElement.style.setProperty(
      "--font-color",
      String(p.font_color || "#FFFFFF")
    );
    // The original browser renderer reads the same saved settings; 0 percent
    // remains a valid fully transparent surface. No alternative backend.
    const opacity = (value, fallback) => {
      const numeric = value === undefined || value === null || value === ""
        ? fallback : Number(value);
      return Math.max(0, Math.min(100, Number.isFinite(numeric) ? numeric : fallback)) / 100;
    };
    const toRgba = (value, alpha) => {
      const matched = /^#([0-9a-f]{6})$/i.exec(String(value || ""));
      if (!matched) return `rgba(255,255,255,${alpha})`;
      const code = matched[1];
      return `rgba(${parseInt(code.slice(0,2),16)},${parseInt(code.slice(2,4),16)},${parseInt(code.slice(4,6),16)},${alpha})`;
    };
    const css = document.documentElement.style;
    const panelAlpha = opacity(p.card_panel_opacity, 74);
    const rowAlpha = opacity(p.card_row_opacity, 76);
    const headerAlpha = opacity(p.card_header_opacity, 94);
    css.setProperty("--lot-panel-bg", toRgba(p.card_panel_color || "#0A0D10", panelAlpha));
    css.setProperty("--lot-cell-bg", toRgba(p.card_row_color || "#182834", rowAlpha));
    css.setProperty("--lot-header-bg", toRgba(p.card_header_color || "#244054", headerAlpha));
    css.setProperty("--lot-panel-border", String(p.card_frame_color || "#FFFFFF"));
    css.setProperty("--lot-row-border", String(p.card_row_frame_color || "#FFFFFF"));
    css.setProperty("--lot-panel-glow", toRgba(p.card_frame_color || "#FFFFFF", .45));
    css.setProperty("--lot-row-glow", toRgba(p.card_row_frame_color || "#FFFFFF", .45));
    css.setProperty("--lot-header-font-family",
      JSON.stringify(String(p.card_header_font_family || "Segoe UI")));
    css.setProperty("--lot-header-font-size",
      Math.max(8, Math.min(160, Number(p.card_header_font_size) || 24)) + "px");
    css.setProperty("--lot-header-font-color",
      String(p.card_header_font_color || "#FFFFFF"));
    measureCache.clear();

    const mode = String(p.background || "transparent");
    // Never paint the body itself: the entire 16px source gutter must
    // remain alpha=0 for both chosen color and image/video backgrounds.
    document.body.style.backgroundColor = "transparent";
    clearMediaBackground();
    if (mode === "color") {
      background.style.backgroundColor = String(p.background_color || "#000000");
      background.style.display = "block";
    }

    const media = p.background_media || {};
    if (mode === "media" && media.available && media.url) {
      if (String(media.type || "") === "video") {
        backgroundVideo.src = String(media.url);
        backgroundVideo.style.display = "block";
        backgroundVideo.play().catch(() => {});
      } else {
        background.style.backgroundImage =
          'url("' + String(media.url).replace(/"/g, "%22") + '")';
        background.style.display = "block";
      }
    }
    scheduleColumnSync();
    return true;
  }

  function maximumScroll() {
    return Math.max(0, table.scrollHeight - viewport.clientHeight);
  }

  function applyScroll() {
    table.style.transform = `translateY(${-scrollY}px)`;
  }

  function clampScroll() {
    const maximum = maximumScroll();
    scrollY = Math.max(0, Math.min(scrollY, maximum));
    if (maximum <= 0) direction = 1;
    applyScroll();
  }

  function applyPayload(payload) {
    ObsVisibility.apply(payload?.visibility);
    renderRows(payload || {});
    applyPresentation((payload || {}).presentation || {});
    renderFooter(payload);
    const nextAutoScroll = Boolean((payload || {}).auto_scroll);
    if (nextAutoScroll !== autoScroll) {
      autoScroll = nextAutoScroll;
      const maximum = maximumScroll();
      direction = scrollY >= maximum - 1 && maximum > 0 ? -1 : 1;
      lastFrame = performance.now();
    }
  }

  function renderFooter(payload) {
    const visible = Boolean((payload || {}).show_total_footer);
    // Value comes from the same A6 total backend as the always-visible
    // desktop label; never sum the currently visible/filtered list rows.
    const value = Math.max(0, Number((payload || {}).total_sm_points) || 0);
    const formatted = String(Math.floor(value)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const text = "Всего баллов в аукционе: " + formatted;
    if (totalFooter.textContent !== text) totalFooter.textContent = text;
    totalFooter.style.display = visible ? "block" : "none";
    // Footer is outside #viewport, so all scrolling geometry excludes it.
    clampScroll();
  }

  function scrollFrame(now) {
    const dt = Math.min(100, Math.max(0, now - lastFrame));
    lastFrame = now;
    if (autoScroll) {
      const maximum = maximumScroll();
      if (maximum > 0) {
        scrollY += direction * SPEED_PX_PER_SECOND * dt / 1000;
        if (scrollY >= maximum) {
          scrollY = maximum;
          direction = -1;
        } else if (scrollY <= 0) {
          scrollY = 0;
          direction = 1;
        }
        applyScroll();
      } else if (scrollY !== 0) {
        scrollY = 0;
        applyScroll();
      }
    }
    requestAnimationFrame(scrollFrame);
  }

  async function update() {
    try {
      const response = await fetch(API, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      applyPayload(await response.json());
      apiState.classList.remove("visible");
    } catch (_error) {
      apiState.classList.add("visible");
    }
  }

  new ResizeObserver(() => {
    scheduleColumnSync();
    clampScroll();
  }).observe(viewport);

  setInterval(update, POLL_MS);
  requestAnimationFrame(scrollFrame);
  update();
})();
</script>
</body>
</html>
