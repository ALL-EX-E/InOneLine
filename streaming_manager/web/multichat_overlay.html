<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InOneLine — чат Twitch (OBS)</title>
<style>
* {box-sizing:border-box}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body {color:#fff;font:18px/1.3 sans-serif}
/* Fixed safe area: preserve glow and border inside any OBS/browser viewport. */
:root {--chat-edge-inset:12px}
#shell {position:absolute;left:var(--chat-edge-inset);right:var(--chat-edge-inset);
  bottom:var(--chat-edge-inset);max-height:calc(100% - 2 * var(--chat-edge-inset));overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;
  background:transparent;isolation:isolate}
#shell.always {top:var(--chat-edge-inset);height:calc(100% - 2 * var(--chat-edge-inset))}
#shell.hidden {display:none}
#bg-image,#bg-video {position:absolute;inset:0;width:100%;height:100%;display:none;
  object-position:center;object-fit:cover;pointer-events:none;z-index:-1}
#messages {position:relative;width:100%;max-height:100%;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end}
.message {flex-shrink:0;min-width:0;padding:4px 8px;background:rgba(0,0,0,.5);
  overflow-wrap:anywhere}
/* A fixed gap separates neighbouring glowing borders without altering message order. */
.message + .message {margin-top:10px}
.header {display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-height:1.3em}
.platform-icon {display:inline-block;width:auto;height:1em;flex-shrink:0}
.avatar {border-radius:50%;width:1.35em;height:1.35em;object-fit:cover}
.badge {width:auto;height:1em;max-width:2em;object-fit:contain}
.name {font-weight:700}
.time {opacity:.8;margin-left:2px}
.text {white-space:pre-wrap;overflow-wrap:anywhere}
.emote {height:1.5em;max-width:10em;width:auto;vertical-align:middle;object-fit:contain}
</style>
</head>
<body>
<div id="shell"><img id="bg-image" alt="" aria-hidden="true"><video id="bg-video" muted autoplay loop playsinline preload="auto" aria-hidden="true"></video><div id="messages" aria-live="off"></div></div>
<script>
(() => {
  "use strict";
  const root = document.getElementById("messages");
  const shell = document.getElementById("shell");
  const bgImage = document.getElementById("bg-image");
  const bgVideo = document.getElementById("bg-video");
  let appearanceKey = "";
  let currentTwitch = {};
  let currentCommon = {};
  const ns = "http://www.w3.org/2000/svg";
  const TWITCH_PATH = "M692.9 535 617 607h-76l-66.5 63v-63H389V337.2h303.9V535zM370 301.2l-95 89.9v323.8h114v89.9l95-89.9h76L730.9 553V301.2H370zM636 403h-38v107.9h38V403zm-142.5-.5h38v107.9h-38V402.5z";
  let last = "";
  const node = (parent, tag, text, cls) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = String(text || "");
    parent.appendChild(el);
    return el;
  };
  const verifiedImage = value => {
    try {
      if (typeof value !== "string" || value.length > 2048) return "";
      const u = new URL(value);
      const host = u.hostname.toLowerCase();
      const roots = ["jtvnw.net","twitchcdn.net","ttvnw.net","tenor.com","giphy.com",
                     "cdn.betterttv.net","cdn.frankerfacez.com","cdn.7tv.app"];
      if (u.protocol !== "https:" || u.username || u.password ||
          (u.port && u.port !== "443") ||
          !roots.some(root => host === root || host.endsWith("." + root))) return "";
      return u.href;
    } catch (_) { return ""; }
  };
  const warmCache = new Map();
  const failedWarm = new Set();
  function prewarmMedia(urls) {
    if (!Array.isArray(urls)) return;
    // Reuse the Browser Source's normal HTTP image cache, not a second API
    // or another platform connection. Keep only a handful of warm assets.
    for (const raw of urls.slice(0, 24)) {
      const url = verifiedImage(raw);
      if (!url || warmCache.has(url) || failedWarm.has(url) ||
          warmCache.size >= 12) continue;
      const img = new Image();
      img.decoding = "async";
      img.loading = "eager";
      warmCache.set(url, img);
      img.onerror = () => {
        warmCache.delete(url);
        if (failedWarm.size < 128) failedWarm.add(url);
      };
      img.src = url;
    }
  }
  function image(parent, src, cls, textFallback) {
    const url = verifiedImage(src);
    if (!url) {
      if (textFallback) node(parent, "span", textFallback, "");
      return;
    }
    const img = document.createElement("img");
    img.src = url;
    img.className = cls;
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => {
      if (textFallback) {
        const span = document.createElement("span");
        span.textContent = textFallback;
        img.replaceWith(span);
      } else img.remove();
    };
    parent.appendChild(img);
  }
  function platformIcon(parent) {
    const icon = document.createElementNS(ns, "svg");
    icon.setAttribute("viewBox", "0 0 1024 1024");
    icon.setAttribute("class", "platform-icon");
    icon.setAttribute("aria-label", "Twitch");
    const circle = document.createElementNS(ns, "circle");
    circle.setAttribute("cx", "512"); circle.setAttribute("cy", "512");
    circle.setAttribute("r", "512"); circle.setAttribute("fill", "#9146ff");
    icon.appendChild(circle);
    const glyph = document.createElementNS(ns, "path");
    glyph.setAttribute("d", TWITCH_PATH); glyph.setAttribute("fill", "#fff");
    icon.appendChild(glyph);
    parent.appendChild(icon);
  }
  function safeColor(value, fallback) {
    return /^#[0-9A-Fa-f]{6}$/.test(String(value)) ? value : fallback;
  }
  function bounded(value, fallback, lower, upper) {
    const n = Number(value);
    return Number.isInteger(n) ? Math.min(upper, Math.max(lower,n)) : fallback;
  }
  function safeFont(value) {
    return /^[\w +,.()\-]{1,80}$/u.test(String(value)) ? value : "Segoe UI";
  }
  function rgba(hex, percent) {
    const c = safeColor(hex, "#000000");
    const a = bounded(percent, 0, 0, 100) / 100;
    return "rgba("+parseInt(c.slice(1,3),16)+","+parseInt(c.slice(3,5),16)+","+parseInt(c.slice(5,7),16)+","+a+")";
  }
  function applyAppearance(value) {
    const a = value && typeof value === "object" ? value : {};
    const twitch = a.twitch && typeof a.twitch === "object" ? a.twitch : {};
    const common = a.common && typeof a.common === "object" ? a.common : {};
    const key = JSON.stringify([twitch,common]);
    if (key === appearanceKey) return;
    appearanceKey = key;
    currentTwitch = twitch;
    currentCommon = common;
    const bg = ["transparent","color","media"].includes(common.background)
      ? common.background : "transparent";
    shell.style.background = bg === "color"
      ? rgba(common.background_color,common.background_opacity) : "transparent";
    shell.style.border = common.glow ? "1px solid "+rgba(common.glow_color,70) : "none";
    shell.style.boxShadow = common.glow ?
      "inset 0 0 8px "+rgba(common.glow_color,22)+
      ",inset 0 0 16px "+rgba(common.glow_color,42)+
      ",0 0 6px "+rgba(common.glow_color,52) : "none";
    // Keep the external glow visible via the source's 12px safe area.
    shell.classList.toggle("always", common.visibility === "always");
    const media = bg === "media" && /^\/media\/[0-9]+$/.test(String(common.media_url || ""))
      ? common.media_url : "";
    const fit = common.background_fit === "contain" ? "contain" : "cover";
    bgImage.style.objectFit = fit;
    bgVideo.style.objectFit = fit;
    bgImage.style.display = media && common.media_kind === "image" ? "block" : "none";
    bgVideo.style.display = media && common.media_kind === "video" ? "block" : "none";
    if (bgImage.style.display === "block") {
      if (bgImage.getAttribute("src") !== media) bgImage.src = media;
    } else bgImage.removeAttribute("src");
    if (bgVideo.style.display === "block") {
      if (bgVideo.getAttribute("src") !== media) {
        bgVideo.src = media;
        bgVideo.load();
      }
      bgVideo.muted = true;
      const start = bgVideo.play();
      if (start && typeof start.catch === "function") start.catch(()=>{});
    } else {
      bgVideo.pause();
      if (bgVideo.hasAttribute("src")) {
        bgVideo.removeAttribute("src");
        bgVideo.load();
      }
    }
  }

  function appendMessage(message, showTime, showIcons) {
    const row = document.createElement("div");
    row.className = "message";
    const custom = currentTwitch.mode === "custom";
    if (custom) {
      row.style.background = rgba(currentTwitch.card_color,currentTwitch.card_opacity);
      const border = bounded(currentTwitch.card_border_width,0,0,12);
      row.style.border = border+"px solid "+safeColor(currentTwitch.card_border_color,"#FFFFFF");
      row.style.borderRadius = bounded(currentTwitch.card_radius,0,0,64)+"px";
      row.style.color = safeColor(currentTwitch.text_color,"#FFFFFF");
      row.style.fontFamily = safeFont(currentTwitch.text_font);
      row.style.fontSize = bounded(currentTwitch.text_size,18,6,96)+"px";
    }
    const header = document.createElement("div");
    header.className = "header";
    if (showIcons) platformIcon(header);
    image(header, message.avatar_url, "avatar", "");
    if (custom) { const avatar=header.querySelector(".avatar"); if(avatar){const px=bounded(currentTwitch.avatar_size,24,8,96);avatar.style.width=px+"px";avatar.style.height=px+"px";} }
    // Twitch badge order comes from the original EventSub event.
    if (Array.isArray(message.badges)) {
      for (const badge of message.badges.slice(0,16)) {
        if (badge && typeof badge === "object") image(header, badge.url, "badge", "");
      }
    }
    if (custom) for(const b of header.querySelectorAll(".badge")) {b.style.height=bounded(currentTwitch.badge_size,18,8,64)+"px";}
    const author = node(header, "span", message.author, "name");
    if (custom) {
      author.style.color=safeColor(currentTwitch.name_color,"#FFFFFF");
      author.style.fontFamily=safeFont(currentTwitch.name_font);
      author.style.fontSize=bounded(currentTwitch.name_size,18,6,96)+"px";
    } else if (/^#[0-9a-fA-F]{6}$/.test(String(message.color || "")))
      author.style.color = message.color;
    if (showTime) {
      const value = message.sent_at ?? message.received_at;
      if (typeof value === "number" && Number.isFinite(value)) {
        const date = new Date(value * 1000);
        node(header, "span", date.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), "time");
      }
    }
    row.appendChild(header);
    const body = document.createElement("div");
    body.className = "text";
    if (Array.isArray(message.fragments) && message.fragments.length) {
      for (const frag of message.fragments.slice(0,256)) {
        if (!frag || typeof frag !== "object") continue;
        if (frag.kind === "image")
          image(body, frag.url, "emote", String(frag.text || ""));
        else node(body, "span", String(frag.text || ""), "");
      }
    } else {
      body.textContent = String(message.text || "");
    }
    row.appendChild(body);
    root.appendChild(row);
  }
  async function update() {
    try {
      const response = await fetch("/api/multichat", {cache:"no-store"});
      if (!response.ok) return;
      const state = await response.json();
      prewarmMedia(state.media_preload && state.media_preload.twitch);
      applyAppearance(state.appearance);
      const messages = Array.isArray(state.messages) ?
        state.messages.filter(message => message.platform === "twitch") : [];
      const sig = JSON.stringify([state.show_time,state.show_platform_icons,messages,appearanceKey]);
      if (sig === last) return;
      last = sig;
      root.replaceChildren();
      for (const message of messages)
        appendMessage(message, state.show_time, state.show_platform_icons !== false);
      shell.classList.toggle("hidden", messages.length === 0 && currentCommon.visibility !== "always");
      // Only OBS source height clips older rows; never truncate message contents horizontally.
      while (root.scrollHeight > root.clientHeight && root.firstElementChild)
        root.firstElementChild.remove();
    } catch (_) { /* operator diagnostics stay in InOneLine */ }
  }
  update();
  setInterval(update, 500);
})();
</script>
</body>
</html>
