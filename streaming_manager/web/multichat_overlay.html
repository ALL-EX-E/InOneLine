<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InOneLine — мультичат OBS</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { display: flex; align-items: flex-end; font: 18px/1.3 sans-serif; color: white; }
#messages { width: 100%; max-height: 100%; overflow: hidden; display: flex;
            flex-direction: column; justify-content: flex-end; }
.message { box-sizing: border-box; flex-shrink: 0; padding: 4px 8px;
           background: rgba(0,0,0,.5); overflow-wrap: anywhere; }
.source, .name { font-weight: 700; }
.source { margin-right: 6px; }
.time { opacity: .8; margin-left: 5px; }
.text { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="messages" aria-live="off"></div>
<script>
(() => {
  "use strict";
  const root = document.getElementById("messages");
  let last = "";
  const add = (parent, tag, text, className) => {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    parent.appendChild(element);
  };
  async function update() {
    try {
      const response = await fetch("/api/multichat", {cache: "no-store"});
      if (!response.ok) return;
      const state = await response.json();
      const messages = Array.isArray(state.messages) ? state.messages : [];
      const signature = JSON.stringify([state.show_time, messages]);
      if (signature === last) return;
      last = signature;
      root.replaceChildren();
      for (const message of messages) {
        const row = document.createElement("div");
        row.className = "message";
        add(row, "span", String(message.platform || ""), "source");
        add(row, "span", String(message.author || ""), "name");
        if (state.show_time) {
          const value = message.sent_at ?? message.received_at;
          if (typeof value === "number" && Number.isFinite(value)) {
            const date = new Date(value * 1000);
            add(row, "span", date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}), "time");
          }
        }
        add(row, "div", String(message.text || ""), "text");
        root.appendChild(row);
      }
      // The browser source height, not a custom row count, clips older rows.
      while (root.scrollHeight > root.clientHeight && root.firstElementChild) {
        root.firstElementChild.remove();
      }
    } catch (_) { /* operator sees diagnostics in InOneLine, never in OBS */ }
  }
  update();
  setInterval(update, 500);
})();
</script>
</body>
</html>
