name: Candidate 1.0.8 Conditional UI Visibility

on:
  push:
    branches:
      - post-d26-conditional-ui-1.0.8-candidate

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and conditional UI semantic smoke
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          if ($LASTEXITCODE -ne 0) { throw "compileall failed" }

          @'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace

          from PySide6.QtWidgets import QApplication

          from streaming_manager.api_server import LocalApiServer
          from streaming_manager.app_paths import AppPaths
          from streaming_manager.constants import APP_VERSION, SCHEMA_VERSION
          from streaming_manager.database import Database
          from streaming_manager.views.completed_auction_history import CompletedAuctionHistoryTab
          from streaming_manager.views.games import GamesTab
          from streaming_manager.views.public import PublicTab
          from streaming_manager.views.settings import SettingsTab
          from streaming_manager.views.stream import StreamTab

          assert APP_VERSION == "1.0.8"
          assert SCHEMA_VERSION == 19

          app = QApplication.instance() or QApplication([])

          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              root = Path(tmp)
              paths = AppPaths.from_root(root)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)
              api = LocalApiServer(db, "127.0.0.1", 0)

              stream = StreamTab(db, api)

              # Timer background: semantic option hides instead of greying.
              stream.timer_background_transparent.setChecked(True)
              stream._update_timer_background_enabled_state()
              assert stream.timer_background_color_row.isHidden()
              stream.timer_background_color_mode.setChecked(True)
              stream._update_timer_background_enabled_state()
              assert not stream.timer_background_color_row.isHidden()

              # Auction Lots background rows are mutually applicable.
              stream.auction_lots_background_transparent.setChecked(True)
              stream._update_auction_lots_background_enabled_state()
              assert stream.auction_lots_background_color_row.isHidden()
              assert stream.auction_lots_background_media_row.isHidden()
              stream.auction_lots_background_color_mode.setChecked(True)
              stream._update_auction_lots_background_enabled_state()
              assert not stream.auction_lots_background_color_row.isHidden()
              assert stream.auction_lots_background_media_row.isHidden()
              stream.auction_lots_background_media_mode.setChecked(True)
              stream._update_auction_lots_background_enabled_state()
              assert stream.auction_lots_background_color_row.isHidden()
              assert not stream.auction_lots_background_media_row.isHidden()

              # Rules color/opacity only exist in Color mode.
              stream.rules_background_transparent.setChecked(True)
              stream._update_rules_background_enabled_state()
              assert stream.rules_background_color_row.isHidden()
              assert stream.rules_background_opacity_control.isHidden()
              stream.rules_background_color_mode.setChecked(True)
              stream._update_rules_background_enabled_state()
              assert not stream.rules_background_color_row.isHidden()
              assert not stream.rules_background_opacity_control.isHidden()

              # Main overlay keeps toggles visible but removes dependent fields.
              stream.webcam_enabled.setChecked(False)
              stream.overlay_list_enabled.setChecked(False)
              stream.info_enabled.setChecked(False)
              stream._update_main_overlay_conditional_visibility()
              assert stream.webcam_position.isHidden()
              assert stream.overlay_list_side.isHidden()
              assert stream.info_position.isHidden()
              assert stream.frame_color_row_widgets["webcam"].isHidden()
              assert stream.frame_color_row_widgets["list"].isHidden()
              assert stream.frame_color_row_widgets["info"].isHidden()
              for key in ("top1", "top2", "top3", "list"):
                  label, row = stream.typography_row_widgets[key]
                  assert label.isHidden() and row.isHidden()
              info_label, info_row = stream.typography_row_widgets["info"]
              assert info_label.isHidden() and info_row.isHidden()

              stream.webcam_enabled.setChecked(True)
              stream.overlay_list_enabled.setChecked(True)
              stream.info_enabled.setChecked(True)
              stream._update_main_overlay_conditional_visibility()
              assert not stream.webcam_position.isHidden()
              assert not stream.overlay_list_side.isHidden()
              assert not stream.info_position.isHidden()
              assert not stream.frame_color_row_widgets["webcam"].isHidden()
              assert not stream.frame_color_row_widgets["list"].isHidden()
              assert not stream.frame_color_row_widgets["info"].isHidden()

              # D26 conditional UI stays intact.
              stream.music_player_show_mode.setCurrentIndex(
                  stream.music_player_show_mode.findData("hidden")
              )
              stream._update_music_player_overlay_enabled_state()
              assert stream.music_player_animation.isHidden()
              assert stream.music_player_direction.isHidden()

              settings = SettingsTab(db, paths, api)
              for checkbox, field in (
                  (settings.auto_extend_leader_enabled, settings.auto_extend_leader_duration),
                  (settings.auto_extend_new_lot_enabled, settings.auto_extend_new_lot_duration),
                  (settings.auto_extend_external_enabled, settings.auto_extend_external_duration),
                  (settings.auto_extend_threshold_enabled, settings.auto_extend_threshold_duration),
              ):
                  checkbox.setChecked(False)
                  settings._update_auto_extend_conditional_visibility()
                  assert field.isHidden()
                  checkbox.setChecked(True)
                  settings._update_auto_extend_conditional_visibility()
                  assert not field.isHidden()
              settings.auto_extend_external_enabled.setChecked(False)
              settings._update_auto_extend_conditional_visibility()
              assert settings.auto_extend_external_service_units_enabled.isHidden()
              settings.auto_extend_external_enabled.setChecked(True)
              settings._update_auto_extend_conditional_visibility()
              assert not settings.auto_extend_external_service_units_enabled.isHidden()

              games = GamesTab(db, lambda: None)
              games._apply_action_state(SimpleNamespace(archived=False), 1)
              assert not games.archive_btn.isHidden()
              assert games.restore_btn.isHidden()
              games._apply_action_state(SimpleNamespace(archived=True), 1)
              assert games.archive_btn.isHidden()
              assert not games.restore_btn.isHidden()
              games._apply_action_state(None, 0)
              assert games.archive_btn.isHidden()
              assert games.restore_btn.isHidden()

              public = PublicTab(db, api)
              public._public_xlsx_path = None
              public._public_xlsx_update_controls()
              assert public.public_xlsx_disconnect_btn.isHidden()
              public._public_xlsx_path = root / "public.xlsx"
              public._public_xlsx_update_controls()
              assert not public.public_xlsx_disconnect_btn.isHidden()

              history = CompletedAuctionHistoryTab(db)
              history._clear_verification_details()
              assert history.verify_result_btn.isHidden()
              assert history.verification_details_btn.isHidden()
              assert history.verification_random_org_btn.isHidden()

              for widget in (history, public, games, settings, stream):
                  widget.deleteLater()
              app.processEvents()

          print("CONDITIONAL UI SEMANTIC SMOKE: PASS")
          '@ | Set-Content -Encoding utf8 conditional_ui_smoke.py
          python conditional_ui_smoke.py

      - name: Static conditional UI invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from streaming_manager.constants import APP_VERSION, SCHEMA_VERSION

          assert APP_VERSION == "1.0.8"
          assert SCHEMA_VERSION == 19

          schema = Path("streaming_manager/db/schema.py").read_text(encoding="utf-8")
          assert schema.count("self._run_migration(") == 15

          stream = Path("streaming_manager/views/stream.py").read_text(encoding="utf-8")
          assert "def _set_form_row_visible" in stream
          assert "def _update_main_overlay_conditional_visibility" in stream
          assert "timer_background_color_row" in stream
          assert "auction_lots_background_media_row" in stream
          assert "rules_background_opacity_control" in stream
          assert "typography_row_widgets" in stream

          settings = Path("streaming_manager/views/settings.py").read_text(encoding="utf-8")
          assert "def _update_auto_extend_conditional_visibility" in settings
          assert "auto_extend_external_service_units_enabled.setVisible" in settings

          games = Path("streaming_manager/views/games.py").read_text(encoding="utf-8")
          assert "archive_visible = bool(game and not game.archived)" in games
          assert "restore_visible = bool(game and game.archived)" in games

          public = Path("streaming_manager/views/public.py").read_text(encoding="utf-8")
          assert "public_xlsx_disconnect_btn.setVisible(connected)" in public

          auction = Path("streaming_manager/views/auction.py").read_text(encoding="utf-8")
          assert "shared_xlsx_disconnect_btn.setVisible(connected)" in auction
          assert "self._set_visible_state(self.delete_lot_btn, enabled)" in auction

          history = Path("streaming_manager/views/completed_auction_history.py").read_text(encoding="utf-8")
          assert "self.verify_result_btn.setVisible(False)" in history
          assert "self.verify_result_btn.setVisible(True)" in history

          notes = Path("RELEASE_NOTES_1.0.8.md").read_text(encoding="utf-8")
          assert "Conditional UI Visibility" in notes
          assert "1.0.7 remains CURRENT" in notes

          print("CONDITIONAL UI STATIC INVARIANTS: PASS")
          '@ | python -

      - name: Confirm protected RNG source remains unchanged
        shell: pwsh
        run: |
          git diff --exit-code 398019836602fb4e3cd1f3f11f5632e014c04729 -- streaming_manager/random_sources.py
          if ($LASTEXITCODE -ne 0) { throw "Random source implementation changed" }
          Write-Host "RANDOM SOURCE PROTECTED DIFF: PASS"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

          $setup = "installer\output\InOneLine_Setup_1.0.8.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          if ($item.VersionInfo.FileVersion -notlike "1.0.8*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen startup/API smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.8.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          Remove-Item $install -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }

          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }
          Remove-Item "$install\data\streaming.db" -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.8") {
              throw "Wrong frozen version: $($health.version)"
            }

            $timer = (Invoke-WebRequest -Uri "http://127.0.0.1:8765/timer-overlay" -TimeoutSec 2).Content
            if ($timer -notmatch 'auction-audio') {
              throw "Existing Timer/D43 Browser Source regression"
            }
            $music = (Invoke-WebRequest -Uri "http://127.0.0.1:8765/music-player-overlay?preview=1" -TimeoutSec 2).Content
            if ($music -notmatch 'createAnalyser' -or $music -notmatch 'marquee') {
              throw "Existing D26 Music Player Browser Source regression"
            }

            Write-Host "FROZEN INSTALL/START/API CONDITIONAL UI SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Create candidate source snapshot
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\source"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Remove-Item "$stage\installer\output" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath "installer\output\InOneLine_CANDIDATE_1.0.8_UI_VISIBILITY_SOURCE.zip" -CompressionLevel Optimal

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.8.exe"
          $source = "installer\output\InOneLine_CANDIDATE_1.0.8_UI_VISIBILITY_SOURCE.zip"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setup).Length
          $sourceSize = (Get-Item $source).Length
          @"
          InOneLine 1.0.8 Conditional UI Visibility candidate
          Branch: post-d26-conditional-ui-1.0.8-candidate
          Commit: $env:GITHUB_SHA
          Schema: 19
          Named migrations: 15
          Installer: InOneLine_Setup_1.0.8.exe
          Installer bytes: $setupSize
          Installer SHA-256: $setupHash
          Source: InOneLine_CANDIDATE_1.0.8_UI_VISIBILITY_SOURCE.zip
          Source bytes: $sourceSize
          Source SHA-256: $sourceHash
          CURRENT 1.0.7 remains untouched pending manual acceptance.
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.8_UI_VISIBILITY_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.8.exe
            installer/output/InOneLine_CANDIDATE_1.0.8_UI_VISIBILITY_SOURCE.zip
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
