name: Publish InOneLine 1.0.7

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES_1.0.7.md

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_ARTIFACT_ID: "11097065150"
      EXPECTED_SETUP_SHA256: "f89e0e713ca53354cda603c1e4748c064c96570edfeef5aa28fbfe1548106dc1"
      EXPECTED_SOURCE_SHA256: "33e11f6590089d479eb9e9a64bde49dfef2858d4caefeab858a000a3e22ee20b"

    steps:
      - uses: actions/checkout@v4

      - name: Download exact accepted Windows artifact
        shell: pwsh
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ACCEPTED_ARTIFACT_ID/zip"
          curl.exe -L -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" $uri -o accepted-artifact.zip
          if (!(Test-Path accepted-artifact.zip)) { throw "Accepted artifact download missing" }
          Expand-Archive accepted-artifact.zip -DestinationPath accepted -Force

      - name: Verify accepted bytes before publication
        shell: pwsh
        run: |
          $setup = "accepted\InOneLine_Setup_1.0.7.exe"
          $sourceCandidate = "accepted\InOneLine_CANDIDATE_1.0.7_D26_SOURCE.zip"
          if (!(Test-Path $setup)) { throw "Accepted installer missing" }
          if (!(Test-Path $sourceCandidate)) { throw "Accepted SOURCE missing" }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $sourceCandidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne $env:EXPECTED_SETUP_SHA256) { throw "Installer SHA mismatch before publication: $setupHash" }
          if ($sourceHash -ne $env:EXPECTED_SOURCE_SHA256) { throw "SOURCE SHA mismatch before publication: $sourceHash" }
          Copy-Item $sourceCandidate "InOneLine_Source_1.0.7.zip" -Force
          if ((Get-FileHash "InOneLine_Source_1.0.7.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SOURCE_SHA256) { throw "SOURCE changed while renaming" }
          Write-Host "ACCEPTED_BYTES_VERIFY=PASS"

      - name: Create GitHub Release from exact accepted bytes
        shell: pwsh
        run: |
          gh release view v1.0.7 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v1.0.7 already exists; refusing to overwrite" }
          gh release create v1.0.7 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "InOneLine 1.0.7" --notes-file "RELEASE_NOTES_1.0.7.md" "accepted\InOneLine_Setup_1.0.7.exe#InOneLine_Setup_1.0.7.exe" "InOneLine_Source_1.0.7.zip#InOneLine_Source_1.0.7.zip"

      - name: Verify published release bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          gh release download v1.0.7 --repo "$env:GITHUB_REPOSITORY" --dir verify --pattern "InOneLine_Setup_1.0.7.exe" --pattern "InOneLine_Source_1.0.7.zip"
          $setup = "verify\InOneLine_Setup_1.0.7.exe"
          $source = "verify\InOneLine_Source_1.0.7.zip"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne $env:EXPECTED_SETUP_SHA256) { throw "Published installer SHA mismatch: $setupHash" }
          if ($sourceHash -ne $env:EXPECTED_SOURCE_SHA256) { throw "Published SOURCE SHA mismatch: $sourceHash" }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.7" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw "Published release has incorrect draft/prerelease state" }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains "InOneLine_Setup_1.0.7.exe") { throw "Installer asset missing" }
          if ($names -notcontains "InOneLine_Source_1.0.7.zip") { throw "SOURCE asset missing" }
          Write-Host "PUBLICATION_VERIFY=PASS"
