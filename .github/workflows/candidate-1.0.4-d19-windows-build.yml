name: Candidate 1.0.4 D19 wheel center image

on:
  push:
    branches:
      - candidate/1.0.4-wheel-center-image

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and D19 source regression gate
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          python .github/candidate_d19_smoke.py

      - name: Static D19 invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from streaming_manager.constants import APP_VERSION, SCHEMA_VERSION
          assert APP_VERSION == "1.0.4"
          assert SCHEMA_VERSION == 18
          schema = Path("streaming_manager/db/schema.py").read_text(encoding="utf-8")
          assert schema.count("self._run_migration(") == 14
          overlay = Path("streaming_manager/web/wheel_overlay.html").read_text(encoding="utf-8")
          assert "drawCenterImage(cx,cy,r)" in overlay
          assert "center_image" in overlay
          wheel = Path("streaming_manager/views/wheel.py").read_text(encoding="utf-8")
          assert "set_center_image_path" in wheel
          assert "painter.setClipPath(clip)" in wheel
          rng = Path("streaming_manager/views/auction_parts/rng.py").read_text(encoding="utf-8")
          assert "center_image" not in rng
          print("D19 STATIC INVARIANTS: PASS")
          '@ | python -

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.4.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"
          if ($item.VersionInfo.FileVersion -notlike "1.0.4*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen startup smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.4.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.4") {
              throw "Wrong frozen version: $($health.version)"
            }
            $wheel = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/wheel" -TimeoutSec 2
            if ($null -eq $wheel.center_image) {
              throw "Frozen /api/wheel has no D19 center_image contract"
            }
            Write-Host "FROZEN INSTALL/START/API D19 SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Create candidate source snapshot
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\source"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist','build') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Remove-Item "$stage\installer\output" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -Directory -Recurse -Force | Where-Object { $_.Name -in @('__pycache__','.pytest_cache') } | Remove-Item -Recurse -Force
          Get-ChildItem $stage -File -Recurse -Force | Where-Object { $_.Extension -in @('.pyc','.pyo') } | Remove-Item -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "installer\output\InOneLine_CANDIDATE_1.0.4_D19_SOURCE.zip" -CompressionLevel Optimal

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.4.exe"
          $source = "installer\output\InOneLine_CANDIDATE_1.0.4_D19_SOURCE.zip"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setup).Length
          $sourceSize = (Get-Item $source).Length
          @"
          InOneLine 1.0.4 D19 wheel center image candidate
          Branch: candidate/1.0.4-wheel-center-image
          Commit: $env:GITHUB_SHA
          Schema: 18
          Named migrations: 14
          Installer: InOneLine_Setup_1.0.4.exe
          Installer bytes: $setupSize
          Installer SHA-256: $setupHash
          Source: InOneLine_CANDIDATE_1.0.4_D19_SOURCE.zip
          Source bytes: $sourceSize
          Source SHA-256: $sourceHash
          CURRENT 1.0.3 remains untouched pending manual acceptance.
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.4_D19_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.4.exe
            installer/output/InOneLine_CANDIDATE_1.0.4_D19_SOURCE.zip
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
