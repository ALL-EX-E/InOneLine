name: Candidate 1.0.6 D21 elimination wheel

on:
  push:
    branches:
      - candidate/1.0.6-d21

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and D21 regression gate
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          python .github/candidate_d21_smoke.py

      - name: Static D21 invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from streaming_manager.constants import (
              APP_VERSION,
              AUCTION_WHEEL_FORMAT_ELIMINATION,
              AUCTION_WHEEL_FORMAT_STANDARD,
              SCHEMA_VERSION,
          )

          assert APP_VERSION == "1.0.6"
          assert SCHEMA_VERSION == 19
          assert AUCTION_WHEEL_FORMAT_STANDARD == "standard"
          assert AUCTION_WHEEL_FORMAT_ELIMINATION == "elimination"

          schema = Path("streaming_manager/db/schema.py").read_text(encoding="utf-8")
          assert schema.count("self._run_migration(") == 15
          assert "weighted_wheel_multi_spin_elimination" in schema
          assert "UNIQUE(auction_id, spin_index)" in schema

          wheel = Path("streaming_manager/db/wheel.py").read_text(encoding="utf-8")
          assert "def archive_elimination_result" in wheel
          assert "def list_wheel_verification_snapshots" in wheel
          assert "next_spin_index" in wheel

          auction = Path("streaming_manager/views/auction.py").read_text(encoding="utf-8")
          assert '"Выбывание"' in auction
          assert "wheel_format_combo" in auction

          rng = Path("streaming_manager/views/auction_parts/rng.py").read_text(encoding="utf-8")
          assert "def handle_wheel_result_action" in rng
          assert "def archive_elimination_result" in rng
          assert "create_ticket" in rng

          overlay = Path("streaming_manager/web/wheel_overlay.html").read_text(encoding="utf-8")
          assert '"Выбывает"' in overlay
          assert "Шанс в этом вращении:" in overlay

          timer = Path("streaming_manager/web/timer_overlay.html").read_text(encoding="utf-8")
          assert 'id="auction-audio"' in timer
          assert "syncAuctionAudio" in timer

          print("D21 STATIC INVARIANTS: PASS")
          '@ | python -

      - name: Confirm protected RNG source remains unchanged
        shell: pwsh
        run: |
          git diff --exit-code c760e70e82702e272c1dd896096aff47628f0c74 -- streaming_manager/random_sources.py
          if ($LASTEXITCODE -ne 0) { throw "Random source implementation changed" }
          Write-Host "RANDOM SOURCE PROTECTED DIFF: PASS"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.6.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"
          if ($item.VersionInfo.FileVersion -notlike "1.0.6*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen startup smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.6.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.6") {
              throw "Wrong frozen version: $($health.version)"
            }
            $wheel = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/wheel" -TimeoutSec 2
            if ($null -eq $wheel.wheel_format) {
              throw "Frozen wheel payload has no D21 format contract"
            }
            $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8765/wheel-overlay" -TimeoutSec 2).Content
            if ($html -notmatch 'Выбывает') {
              throw "Frozen wheel overlay has no elimination wording"
            }
            Write-Host "FROZEN INSTALL/START/API D21 SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Create candidate source snapshot
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\source"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Remove-Item "$stage\installer\output" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath "installer\output\InOneLine_CANDIDATE_1.0.6_D21_SOURCE.zip" -CompressionLevel Optimal

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.6.exe"
          $source = "installer\output\InOneLine_CANDIDATE_1.0.6_D21_SOURCE.zip"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setup).Length
          $sourceSize = (Get-Item $source).Length
          @"
          InOneLine 1.0.6 D21 elimination wheel candidate
          Branch: candidate/1.0.6-d21
          Commit: $env:GITHUB_SHA
          Schema: 19
          Named migrations: 15
          Installer: InOneLine_Setup_1.0.6.exe
          Installer bytes: $setupSize
          Installer SHA-256: $setupHash
          Source: InOneLine_CANDIDATE_1.0.6_D21_SOURCE.zip
          Source bytes: $sourceSize
          Source SHA-256: $sourceHash
          CURRENT 1.0.5 remains untouched pending manual acceptance.
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.6_D21_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.6.exe
            installer/output/InOneLine_CANDIDATE_1.0.6_D21_SOURCE.zip
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
