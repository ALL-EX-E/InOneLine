name: Temporary roadmap transport 20261105
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temp-roadmap-transport-20261105.yml"
permissions:
  contents: read
jobs:
  transfer-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exact tracked Markdown transport
        uses: actions/upload-artifact@v7
        with:
          name: InOneLine_Roadmap_Exact_20261105
          path: docs/Правила_и_дальнейший_распорядок_работ.md
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
