name: Candidate 1.0.1 source QA

on:
  push:
    branches:
      - candidate/1.0.1-auction-lots-overlay

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app.py streaming_manager

      - name: Verify version and schema contract
        run: |
          python - <<'PY'
          from streaming_manager.constants import APP_VERSION, SCHEMA_VERSION
          assert APP_VERSION == "1.0.1", APP_VERSION
          assert SCHEMA_VERSION == 18, SCHEMA_VERSION
          print("version/schema: PASS")
          PY

      - name: Verify Auction lots payload reuses current data
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from streaming_manager.database import Database, Game
          from streaming_manager.constants import (
              AUCTION_LOTS_OVERLAY_BACKGROUND_KEY,
              AUCTION_LOTS_OVERLAY_FONT_SIZE_KEY,
          )

          with TemporaryDirectory() as temp:
              db = Database(Path(temp) / "iol.sqlite3")
              a = db.add_game(Game(None, "Alpha", None, 100, status="not_played"))
              b = db.add_game(Game(None, "Beta", None, 50, status="played"))

              max_payload = db.current_auction_lots_payload({
                  "mode": "max_amount",
                  "auto_scroll": False,
              })
              assert max_payload["mode"] == "max_amount"
              assert max_payload["show_wheel_chance"] is False
              assert max_payload["auto_scroll"] is False
              assert [r["title"] for r in max_payload["rows"]] == ["Alpha", "Beta"]
              assert [r["start_position"] for r in max_payload["rows"]] == [1, 2]
              assert [r["current_position"] for r in max_payload["rows"]] == [1, 2]

              weighted = db.current_auction_lots_payload({
                  "mode": "weighted_wheel",
                  "auto_scroll": True,
              })
              assert weighted["mode"] == "weighted_wheel"
              assert weighted["show_wheel_chance"] is True
              assert weighted["auto_scroll"] is True
              probs = [r["probability"] for r in weighted["rows"]]
              assert abs(sum(probs) - 1.0) < 1e-12

              db.set_auction_wheel_chance_visible(False)
              hidden = db.current_auction_lots_payload({
                  "mode": "weighted_wheel",
                  "auto_scroll": True,
              })
              assert hidden["show_wheel_chance"] is False

              db.set_settings_bulk({
                  AUCTION_LOTS_OVERLAY_BACKGROUND_KEY: "color",
                  AUCTION_LOTS_OVERLAY_FONT_SIZE_KEY: "31",
              })
              styled = db.current_auction_lots_payload({"mode": "max_amount"})
              assert styled["presentation"]["background"] == "color"
              assert styled["presentation"]["font_size"] == 31

              auction_id = db.create_auction_session(
                  "max_amount",
                  600,
                  duration_ms=600000,
              )
              db.add_auction_bid(auction_id, a, 25)
              active = db.current_auction_lots_payload({
                  "mode": "weighted_wheel",
                  "auto_scroll": False,
              })
              assert active["auction_id"] == auction_id
              assert active["mode"] == "max_amount"
              assert active["show_wheel_chance"] is False
              assert active["rows"][0]["game_id"] == a
              assert active["rows"][0]["total_sm_points"] == 125
              print("auction-lots payload: PASS")
          PY

      - name: Verify overlay routes and source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("streaming_manager/api_server.py").read_text(encoding="utf-8")
          html = Path("streaming_manager/web/auction_lots_overlay.html").read_text(encoding="utf-8")
          auction = Path("streaming_manager/views/auction.py").read_text(encoding="utf-8")
          stream = Path("streaming_manager/views/stream.py").read_text(encoding="utf-8")
          installer = Path("installer/InOneLine.iss").read_text(encoding="utf-8-sig")

          assert "/api/auction-lots" in api
          assert "/auction-lots-overlay" in api
          assert 'const API = "/api/auction-lots";' in html
          assert "Копировать URL таймера" in auction
          assert "Виджет списка лотов аукциона" in stream
          assert '#define MyAppVersion "1.0.1"' in installer
          assert "VersionInfoVersion=1.0.1.0" in installer

          # Existing OBS endpoints must remain present.
          for endpoint in (
              "/list-overlay",
              "/wheel-overlay",
              "/rules-overlay",
              "/timer-overlay",
          ):
              assert endpoint in api, endpoint
          print("routes/invariants: PASS")
          PY
