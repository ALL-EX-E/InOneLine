name: InOneLine PERF-01 Shutdown Candidate (Windows)

on:
  push:
    branches:
      - audit/performance-20261031
    paths:
      - "app.py"
      - "streaming_manager/**"
      - "tools/shutdown_lifecycle_smoke.py"
      - "tools/exit_diagnostics_smoke.py"
      - "tools/third_party_catalog_exit_smoke.py"
      - "tools/graceful_frozen_exit_smoke.py"
      - "installer/**"
      - ".github/workflows/performance-shutdown-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-01-windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-lock.txt
          python -m pip check

      - name: Compile all source and tools
        shell: pwsh
        run: |
          python -m compileall -q app.py streaming_manager tools
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }

      - name: PERF-01 DNS, queue, timeout and lifecycle regression
        shell: pwsh
        run: |
          python -m tools.shutdown_lifecycle_smoke
          if ($LASTEXITCODE -ne 0) { throw "PERF-01 lifecycle failed" }

      - name: PERF-01 trace data minimization and chronology smoke
        shell: pwsh
        run: |
          python -m tools.exit_diagnostics_smoke
          if ($LASTEXITCODE -ne 0) { throw "Exit trace smoke failed" }

      - name: PERF-01 third-party catalog nested executor shutdown regression
        shell: pwsh
        run: |
          python -m tools.third_party_catalog_exit_smoke
          if ($LASTEXITCODE -ne 0) { throw "Twitch catalog cleanup failed" }

      - name: Existing chat graphics, appearance, Twitch and API regression
        shell: pwsh
        run: |
          python -m tools.multichat_core_smoke
          if ($LASTEXITCODE -ne 0) { throw "Multichat core failed" }
          python -m tools.multichat_windows_smoke
          if ($LASTEXITCODE -ne 0) { throw "Multichat windows failed" }
          python -m tools.chat_graphics_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat graphics failed" }
          python -m tools.chat_appearance_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat appearance failed" }
          python -m tools.chat_third_party_smoke
          if ($LASTEXITCODE -ne 0) { throw "Third-party chat failed" }
          python -m tools.r06_list_smoke
          if ($LASTEXITCODE -ne 0) { throw "R06 List failed" }

      - name: Build frozen app using existing spec
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean installer/InOneLine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist/InOneLine/InOneLine.exe")) { throw "Frozen app missing" }

      - name: PERF-04 real frozen WM_CLOSE and PID/port release
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python tools/graceful_frozen_exit_smoke.py "dist/InOneLine/InOneLine.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen graceful exit failed" }

      - name: PERF-01 frozen opt-in exit trace smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          INONELINE_EXIT_TRACE: "1"
        run: |
          python tools/graceful_frozen_exit_smoke.py "dist/InOneLine/InOneLine.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen trace exit failed" }
          @'
          import json
          from pathlib import Path
          f = Path("dist/InOneLine/logs/exit_trace.jsonl")
          if not f.is_file():
              raise AssertionError("opt-in trace was not generated")
          rows = [json.loads(line) for line in f.read_text(encoding="utf-8").splitlines()]
          events = [r["event"] for r in rows]
          for required in ("trace_enabled","close_accepted","chat_stopped",
                           "integrations_stopped","api_stopped","close_event_returned",
                           "last_window_closed","about_to_quit","qt_exec_returned"):
              if required not in events:
                  raise AssertionError(f"missing expected trace phase {required}: {events}")
          if events.index("close_accepted") > events.index("close_event_returned"):
              raise AssertionError("wrong close chronology")
          print("FROZEN_EXIT_TRACE=PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Frozen trace verification failed" }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP/InnoSetup710"
          $proc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno install failed: $($proc.ExitCode)" }
          if (!(Test-Path "$inno/ISCC.exe")) { throw "Inno compiler missing" }

      - name: Build candidate installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP/InnoSetup710/ISCC.exe"
          $dist = (Resolve-Path "dist/InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer/InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer failed" }
          $setup = "installer/output/InOneLine_Setup_1.0.8.exe"
          if (!(Test-Path $setup)) { throw "Installer missing" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          Write-Host "PERF01_INSTALLER_SHA256=$hash"

      - name: Publish candidate installer for QA only
        uses: actions/upload-artifact@v4
        with:
          name: InOneLine_PERF01_Shutdown_Candidate
          path: installer/output/InOneLine_Setup_1.0.8.exe
          retention-days: 14
          if-no-files-found: error
