name: Candidate 1.0.3 external event auto-extension

on:
  push:
    branches:
      - candidate/1.0.3-external-service-units

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and source regression gate
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          @'
          import json
          import os
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          sys.path.insert(0, os.getcwd())

          from PySide6.QtWidgets import QApplication, QMessageBox
          from streaming_manager.app_paths import AppPaths
          from streaming_manager.constants import (
              APP_VERSION,
              SCHEMA_VERSION,
              AUCTION_AUTO_EXTEND_EXTERNAL_ENABLED_KEY,
              AUCTION_AUTO_EXTEND_EXTERNAL_MS_KEY,
              AUCTION_AUTO_EXTEND_EXTERNAL_SERVICE_UNITS_ENABLED_KEY,
              AUCTION_AUTO_EXTEND_THRESHOLD_ENABLED_KEY,
              AUCTION_AUTO_EXTEND_LEADER_ENABLED_KEY,
              AUCTION_AUTO_EXTEND_NEW_LOT_ENABLED_KEY,
          )
          from streaming_manager.database import Database, Game
          from streaming_manager.views.main_window import MainWindow

          assert APP_VERSION == "1.0.3", APP_VERSION
          assert SCHEMA_VERSION == 18, SCHEMA_VERSION

          def make_db(root: str, *, service_units: bool):
              paths = AppPaths.from_root(root)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)
              g1 = db.add_game(Game(None, "Alpha", None, 100, status="not_played"))
              db.add_game(Game(None, "Beta", None, 90, status="not_played"))
              auction_id = db.create_auction_session(
                  "max_amount", 300, duration_ms=300_000
              )
              db.upsert_integration_connection(
                  "test",
                  enabled=True,
                  status="connected",
                  provider_config={},
              )
              db.set_settings_bulk({
                  AUCTION_AUTO_EXTEND_EXTERNAL_ENABLED_KEY: "1",
                  AUCTION_AUTO_EXTEND_EXTERNAL_SERVICE_UNITS_ENABLED_KEY:
                      "1" if service_units else "0",
                  AUCTION_AUTO_EXTEND_EXTERNAL_MS_KEY: "60000",
                  AUCTION_AUTO_EXTEND_THRESHOLD_ENABLED_KEY: "0",
                  AUCTION_AUTO_EXTEND_LEADER_ENABLED_KEY: "0",
                  AUCTION_AUTO_EXTEND_NEW_LOT_ENABLED_KEY: "0",
              })
              return db, paths, g1, auction_id

          def extend_logs(db, auction_id):
              with db.connect() as conn:
                  rows = conn.execute(
                      "SELECT after_json FROM change_log "
                      "WHERE entity_type='auction_session' AND entity_id=? "
                      "AND action='auto_extend' ORDER BY id",
                      (auction_id,),
                  ).fetchall()
              return [json.loads(str(row["after_json"])) for row in rows]

          # 1. Currency always participates when main external-donation reason is on.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=False)
              result = db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="currency-1",
                  event_type="test_currency",
                  source_amount="10",
                  source_unit="RUB",
                  unit_kind="currency",
                  game_id=game_id,
              )
              assert result["status"] == "applied", result
              logs = extend_logs(db, auction_id)
              assert len(logs) == 1, logs
              assert logs[0]["matched_reasons"] == ["external_donation"], logs
              assert logs[0]["requested_extension_ms"] == 60000, logs

          # 2. Service units do not extend when the new nested option is OFF.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=False)
              db.set_conversion_rate(
                  "TEST_POINTS", "1",
                  label="Test Points", kind="service", service="test"
              )
              result = db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="service-off-1",
                  event_type="test_service",
                  source_amount="10",
                  source_unit="TEST_POINTS",
                  unit_kind="service",
                  game_id=game_id,
              )
              assert result["status"] == "applied", result
              assert extend_logs(db, auction_id) == []

          # 3. The same provider-neutral service unit extends when the option is ON.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=True)
              db.set_conversion_rate(
                  "TEST_POINTS", "1",
                  label="Test Points", kind="service", service="test"
              )
              result = db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="service-on-1",
                  event_type="test_service",
                  source_amount="10",
                  source_unit="TEST_POINTS",
                  unit_kind="service",
                  game_id=game_id,
              )
              assert result["status"] == "applied", result
              logs = extend_logs(db, auction_id)
              assert len(logs) == 1, logs
              assert logs[0]["matched_reasons"] == ["external_service_unit"], logs
              assert logs[0]["requested_extension_ms"] == 60000, logs

          # 4. Pending currency preserves monetary semantics after a rate is added.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=False)
              pending = db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="pending-currency-1",
                  event_type="test_currency",
                  source_amount="5",
                  source_unit="USD",
                  unit_kind="currency",
                  game_id=game_id,
              )
              assert pending["status"] == "awaiting_rate", pending
              db.set_conversion_rate("USD", "2", label="USD", kind="currency")
              applied = db.apply_pending_conversion_event(pending["pending_id"])
              assert applied["status"] == "applied", applied
              logs = extend_logs(db, auction_id)
              assert len(logs) == 1, logs
              assert logs[0]["matched_reasons"] == ["external_donation"], logs

          # 5. Pending service unit preserves service semantics after a rate is added.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=True)
              pending = db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="pending-service-1",
                  event_type="test_service",
                  source_amount="5",
                  source_unit="PENDING_POINTS",
                  unit_kind="service",
                  game_id=game_id,
              )
              assert pending["status"] == "awaiting_rate", pending
              db.set_conversion_rate(
                  "PENDING_POINTS", "2",
                  label="Pending Points", kind="service", service="test"
              )
              applied = db.apply_pending_conversion_event(pending["pending_id"])
              assert applied["status"] == "applied", applied
              logs = extend_logs(db, auction_id)
              assert len(logs) == 1, logs
              assert logs[0]["matched_reasons"] == ["external_service_unit"], logs

          # 6. Main external reason OFF suppresses service-unit extension even if
          # the nested persisted preference remains ON.
          with TemporaryDirectory() as root:
              db, _paths, game_id, auction_id = make_db(root, service_units=True)
              db.set_setting(AUCTION_AUTO_EXTEND_EXTERNAL_ENABLED_KEY, "0")
              db.set_conversion_rate(
                  "TEST_POINTS", "1",
                  label="Test Points", kind="service", service="test"
              )
              db.process_normalized_integration_event(
                  service_key="test",
                  external_event_id="parent-off-1",
                  event_type="test_service",
                  source_amount="10",
                  source_unit="TEST_POINTS",
                  unit_kind="service",
                  game_id=game_id,
              )
              assert extend_logs(db, auction_id) == []

          # 7. UI contract/persistence.
          captured = []
          original_information = QMessageBox.information
          original_warning = QMessageBox.warning
          QMessageBox.information = staticmethod(
              lambda parent, title, message, *a, **k:
                  captured.append(("info", title, message)) or QMessageBox.Ok
          )
          QMessageBox.warning = staticmethod(
              lambda parent, title, message, *a, **k:
                  captured.append(("warning", title, message)) or QMessageBox.Ok
          )
          app = QApplication.instance() or QApplication([])
          with TemporaryDirectory() as root:
              paths = AppPaths.from_root(root)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)
              db.set_setting("api_port", "18767")
              window = MainWindow(db, paths)
              try:
                  tab = window.settings_tab
                  assert tab.auto_extend_external_enabled.text() == "Внешнее пожертвование"
                  assert tab.auto_extend_external_enabled.isEnabled()
                  assert not tab.auto_extend_external_enabled.isChecked()
                  assert (
                      tab.auto_extend_external_service_units_enabled.text()
                      == "Также учитывать неденежные единицы интеграций"
                  )
                  assert not tab.auto_extend_external_service_units_enabled.isChecked()
                  assert not tab.auto_extend_external_service_units_enabled.isEnabled()
                  assert not tab.auto_extend_external_duration.isEnabled()

                  tab.auto_extend_external_enabled.setChecked(True)
                  assert tab.auto_extend_external_duration.isEnabled()
                  assert tab.auto_extend_external_service_units_enabled.isEnabled()
                  tab.auto_extend_external_service_units_enabled.setChecked(True)
                  tab.save_auction_settings()
                  assert db.get_setting(
                      AUCTION_AUTO_EXTEND_EXTERNAL_ENABLED_KEY, ""
                  ) == "1"
                  assert db.get_setting(
                      AUCTION_AUTO_EXTEND_EXTERNAL_SERVICE_UNITS_ENABLED_KEY, ""
                  ) == "1"

                  tab.auto_extend_external_enabled.setChecked(False)
                  assert not tab.auto_extend_external_duration.isEnabled()
                  assert not tab.auto_extend_external_service_units_enabled.isEnabled()
                  # Child preference is retained while disabled.
                  assert tab.auto_extend_external_service_units_enabled.isChecked()
              finally:
                  window.api.stop()
                  window.close()
                  app.processEvents()

          QMessageBox.information = original_information
          QMessageBox.warning = original_warning

          print("QA-1.0.2-02 SOURCE/DB/UI REGRESSION GATE: PASS")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\candidate_103_smoke.py"
          python "$env:RUNNER_TEMP\candidate_103_smoke.py"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.3.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"
          if ($item.VersionInfo.FileVersion -notlike "1.0.3*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen startup smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.3.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.3") {
              throw "Wrong frozen version: $($health.version)"
            }
            Write-Host "FROZEN INSTALL/START/API SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.3.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          @"
          InOneLine 1.0.3 external event auto-extension candidate
          Branch: candidate/1.0.3-external-service-units
          Commit: $env:GITHUB_SHA
          Installer: InOneLine_Setup_1.0.3.exe
          Bytes: $size
          SHA-256: $hash
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.3_EXTERNAL_AUTO_EXTEND_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.3.exe
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
