name: Candidate 1.0.7 D26 Music Player

on:
  push:
    branches:
      - d26-music-player-1.0.7-candidate

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and D26 semantic smoke
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          if ($LASTEXITCODE -ne 0) { throw "compileall failed" }

          @'
          import hashlib
          import json
          import socket
          import tempfile
          import urllib.request
          import wave
          import zipfile
          from pathlib import Path
          from types import SimpleNamespace

          from PySide6.QtCore import Qt
          from PySide6.QtWidgets import QApplication, QComboBox, QLabel, QFileDialog, QMessageBox

          from streaming_manager.api_server import LocalApiServer
          from streaming_manager.app_paths import AppPaths
          from streaming_manager.audio import AudioCoordinator
          from streaming_manager.constants import (
              APP_VERSION,
              MUSIC_PLAYER_ORDER_ALPHABETICAL,
              MUSIC_PLAYER_ORDER_SHUFFLE,
              MUSIC_PLAYER_OUTPUT_MODE_APPLICATION,
              MUSIC_PLAYER_OUTPUT_MODE_OBS,
              MUSIC_PLAYER_CURRENT_MEDIA_ID_KEY,
              MUSIC_PLAYER_POSITION_MS_KEY,
              AUCTION_SOUNDTRACK_MEDIA_ID_KEY,
              WHEEL_SOUNDTRACK_MEDIA_ID_KEY,
              SCHEMA_VERSION,
          )
          from streaming_manager.database import Database
          from streaming_manager.backup_restore import (
              FULL_BACKUP_FORMAT,
              FULL_BACKUP_FORMAT_VERSION,
              LEGACY_FULL_BACKUP_MANAGED_DIRS,
              validate_full_backup_archive,
          )
          from streaming_manager.media import (
              MEDIA_CATEGORY_MUSIC,
              MEDIA_CATEGORY_SOUNDTRACK,
              MEDIA_STORAGE_EXTERNAL,
              MEDIA_STORAGE_MANAGED,
              managed_media_directory,
          )
          from streaming_manager.music_player import (
              PLAYER_PAUSE,
              PLAYER_PLAY,
              PLAYER_STOP,
              MusicPlayerController,
          )
          from streaming_manager.views.auction_parts.audio import AuctionAudioMixin
          from streaming_manager.views.music import MusicTab
          from streaming_manager.views.stream import StreamTab

          assert APP_VERSION == "1.0.7"
          assert SCHEMA_VERSION == 19

          def make_wav(path: Path, seconds: float = 0.15):
              path.parent.mkdir(parents=True, exist_ok=True)
              frames = int(8000 * seconds)
              with wave.open(str(path), "wb") as out:
                  out.setnchannels(1)
                  out.setsampwidth(2)
                  out.setframerate(8000)
                  out.writeframes(b"\x00\x00" * frames)

          app = QApplication.instance() or QApplication([])

          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              root = Path(tmp)
              paths = AppPaths.from_root(root)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)

              # D26 extends full backups with data\\soundtrack, but 1.0.7 must
              # continue accepting the exact format-1 directory declaration
              # written by released 1.0.6 backups.
              database_bytes = paths.database_path.read_bytes()
              legacy_backup = root / "legacy_1_0_6.iolbackup"
              legacy_manifest = {
                  "format": FULL_BACKUP_FORMAT,
                  "format_version": FULL_BACKUP_FORMAT_VERSION,
                  "app_version": "1.0.6",
                  "schema_version": 19,
                  "created_at_utc": "2026-09-29T00:00:00+00:00",
                  "database": "data/streaming.db",
                  "managed_directories": list(LEGACY_FULL_BACKUP_MANAGED_DIRS),
                  "credentials_protection": "windows-dpapi-current-user",
                  "files": [{
                      "path": "data/streaming.db",
                      "size": len(database_bytes),
                      "sha256": hashlib.sha256(database_bytes).hexdigest(),
                  }],
              }
              with zipfile.ZipFile(legacy_backup, "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr(
                      "manifest.json",
                      json.dumps(legacy_manifest, ensure_ascii=False),
                  )
                  archive.writestr("data/streaming.db", database_bytes)
              assert validate_full_backup_archive(legacy_backup)["app_version"] == "1.0.6"

              music_dir = managed_media_directory(paths.data_dir, MEDIA_CATEGORY_MUSIC)
              soundtrack_dir = managed_media_directory(paths.data_dir, MEDIA_CATEGORY_SOUNDTRACK)
              make_wav(music_dir / "B track.wav")
              make_wav(music_dir / "A track.wav")
              make_wav(soundtrack_dir / "auction.wav")

              music_assets = db.sync_managed_media_category(MEDIA_CATEGORY_MUSIC)
              soundtrack_assets = db.sync_managed_media_category(MEDIA_CATEGORY_SOUNDTRACK)
              assert [a.display_name for a in music_assets] == ["A track.wav", "B track.wav"]
              assert [a.display_name for a in soundtrack_assets] == ["auction.wav"]

              coordinator = AudioCoordinator()
              player = MusicPlayerController(db, coordinator)

              assert player.desired_state == PLAYER_PAUSE
              assert coordinator.owner == "music_player"
              assert player.order_mode == MUSIC_PLAYER_ORDER_ALPHABETICAL
              assert [a.display_name for a in player.assets_in_queue()] == ["A track.wav", "B track.wav"]

              first = player.assets_in_queue()[0]
              player.select_media(first.id, play=True)
              assert player.desired_state == PLAYER_PLAY
              coordinator.acquire_auction()
              assert coordinator.owner == "auction"
              assert player.suppressed is True
              coordinator.release_auction()
              assert coordinator.owner == "music_player"
              assert player.suppressed is False
              assert player.desired_state == PLAYER_PLAY

              coordinator.acquire_auction()
              player.stop()
              assert player.desired_state == PLAYER_STOP
              coordinator.release_auction()
              assert player.desired_state == PLAYER_STOP

              # Preparing a different track while paused must defer, not lose,
              # the transient "new track" event until that track actually starts.
              second_asset = player.assets_in_queue()[1]
              before_event = int(player.browser_state()["event_serial"])
              player.select_media(second_asset.id, play=False)
              assert int(player.browser_state()["event_serial"]) == before_event
              player.play_pause()
              assert int(player.browser_state()["event_serial"]) == before_event + 1
              player.stop()
              player.select_media(first.id, play=False)

              player.set_order_mode(MUSIC_PLAYER_ORDER_SHUFFLE)
              assert player.order_mode == MUSIC_PLAYER_ORDER_SHUFFLE
              assert sorted(player.queue) == sorted(a.id for a in music_assets)
              player.set_order_mode(MUSIC_PLAYER_ORDER_ALPHABETICAL)
              assert player.order_mode == MUSIC_PLAYER_ORDER_ALPHABETICAL

              player.set_repeat_current(True)
              assert player.repeat_current is True
              player.set_output_mode(MUSIC_PLAYER_OUTPUT_MODE_OBS)
              assert player.output_mode == MUSIC_PLAYER_OUTPUT_MODE_OBS
              player.set_output_mode(MUSIC_PLAYER_OUTPUT_MODE_APPLICATION)
              assert player.output_mode == MUSIC_PLAYER_OUTPUT_MODE_APPLICATION
              player.set_volume_percent(73)
              player.set_muted(True)
              assert player.volume_percent == 73
              assert player.muted is True
              player.set_muted(False)

              class FakeAuction(AuctionAudioMixin):
                  def __init__(self, coord):
                      self.db = db
                      self.audio_coordinator = coord
                      self.auction_audio = SimpleNamespace(
                          muted=False,
                          active=False,
                          paused=False,
                          current_source=None,
                      )
                      self.wheel_audio = SimpleNamespace(muted=False)
                      self.auction_available = True
                      self.wheel_available = True
                      self.auction_soundtrack_combo = QComboBox()
                      self.auction_soundtrack_status = QLabel()
                      self._auction_audio_runtime_error = ""

                  def _current_session(self):
                      return None

                  def _configured_soundtrack_asset(self, setting_key):
                      if setting_key == AUCTION_SOUNDTRACK_MEDIA_ID_KEY:
                          return object() if self.auction_available else None
                      if setting_key == WHEEL_SOUNDTRACK_MEDIA_ID_KEY:
                          return object() if self.wheel_available else None
                      return None

                  @staticmethod
                  def _wheel_spin_complete(_session):
                      return False

              player.select_media(first.id, play=True)
              auction = FakeAuction(coordinator)
              max_running = {"status": "running", "mode": "max_amount"}
              auction._sync_audio_owner_with_session(max_running)
              assert coordinator.owner == "auction" and player.suppressed is True

              auction.auction_audio.muted = True
              auction._sync_audio_owner_with_session(max_running)
              assert coordinator.owner == "music_player" and player.suppressed is False

              auction.auction_audio.muted = False
              auction._sync_audio_owner_with_session(max_running)
              assert coordinator.owner == "auction" and player.suppressed is True
              auction._sync_audio_owner_with_session(
                  {"status": "tie_break_required", "mode": "max_amount"}
              )
              assert coordinator.owner == "music_player" and player.suppressed is False

              wheel_spin = {
                  "status": "winner_selected",
                  "mode": "weighted_wheel",
                  "wheel_spin_id": 1,
              }
              auction._sync_audio_owner_with_session(wheel_spin, spin_running=True)
              assert coordinator.owner == "auction" and player.suppressed is True
              auction.wheel_audio.muted = True
              auction._sync_audio_owner_with_session(wheel_spin, spin_running=True)
              assert coordinator.owner == "music_player" and player.suppressed is False

              # Regression for the manual Windows gate: selecting
              # "Использовать исходный файл" must immediately become the
              # visible/current auction soundtrack instead of snapping back
              # to "— без soundtrack —".
              windows_like_external = (
                  root / "Оформление Канала" / "ZVUK" / "DONAT.mp3"
              )
              make_wav(windows_like_external)
              # Managed-copy regression: calling through the mixin instance
              # must not accidentally bind self as a third positional
              # argument. This is the exact Windows error reported during the
              # manual gate.
              managed_copy_target = (
                  managed_media_directory(
                      db.path.parent, MEDIA_CATEGORY_SOUNDTRACK
                  )
                  / "COPIED_DONAT.mp3"
              )
              copied = auction._copy_auction_soundtrack(
                  windows_like_external,
                  managed_copy_target,
              )
              assert copied == managed_copy_target
              assert managed_copy_target.exists()

              chosen_external = db.register_external_media_asset(
                  MEDIA_CATEGORY_SOUNDTRACK,
                  windows_like_external,
              )
              auction._adopt_auction_soundtrack_asset(chosen_external.id)
              assert int(auction.auction_soundtrack_combo.currentData()) == chosen_external.id
              assert db.get_setting(
                  AUCTION_SOUNDTRACK_MEDIA_ID_KEY, ""
              ) == str(chosen_external.id)
              assert "DONAT.mp3" in auction.auction_soundtrack_combo.currentText()

              # Shared managed soundtrack catalog must not turn external
              # references into reusable library entries. Each selector sees
              # only its own currently selected external reference.
              external_wheel_path = root / "external-wheel.wav"
              external_auction_path = root / "external-auction.wav"
              make_wav(external_wheel_path)
              make_wav(external_auction_path)
              external_wheel = db.register_external_media_asset(
                  MEDIA_CATEGORY_SOUNDTRACK, external_wheel_path
              )
              external_auction = db.register_external_media_asset(
                  MEDIA_CATEGORY_SOUNDTRACK, external_auction_path
              )
              db.set_setting(
                  WHEEL_SOUNDTRACK_MEDIA_ID_KEY, str(external_wheel.id)
              )
              db.set_setting(
                  AUCTION_SOUNDTRACK_MEDIA_ID_KEY, str(external_auction.id)
              )
              wheel_visible = auction._soundtrack_assets_for_setting(
                  WHEEL_SOUNDTRACK_MEDIA_ID_KEY
              )
              auction_visible = auction._soundtrack_assets_for_setting(
                  AUCTION_SOUNDTRACK_MEDIA_ID_KEY
              )
              assert external_wheel.id in {a.id for a in wheel_visible}
              assert external_auction.id not in {a.id for a in wheel_visible}
              assert external_auction.id in {a.id for a in auction_visible}
              assert external_wheel.id not in {a.id for a in auction_visible}
              assert soundtrack_assets[0].id in {a.id for a in wheel_visible}
              assert soundtrack_assets[0].id in {a.id for a in auction_visible}

              db.set_setting(
                  WHEEL_SOUNDTRACK_MEDIA_ID_KEY, str(soundtrack_assets[0].id)
              )
              wheel_visible = auction._soundtrack_assets_for_setting(
                  WHEEL_SOUNDTRACK_MEDIA_ID_KEY
              )
              assert external_wheel.id not in {a.id for a in wheel_visible}
              assert external_auction.id not in {a.id for a in wheel_visible}

              api_socket = socket.socket()
              api_socket.bind(("127.0.0.1", 0))
              port = api_socket.getsockname()[1]
              api_socket.close()
              api = LocalApiServer(db, "127.0.0.1", port)
              api.set_music_player_state_provider(player.browser_state)
              api.set_music_player_cover_provider(player.cover_bytes)

              music_tab = MusicTab(db, player)
              stream_tab = StreamTab(db, api)
              assert music_tab.mode_combo.count() == 2
              assert music_tab.output_combo.count() == 2
              assert music_tab.search.isClearButtonEnabled()

              # Multi-select import: Ctrl/Shift native selection returns several
              # paths and one action adds them in one batch without changing
              # the currently prepared track.
              batch_a = root / "batch-a.wav"
              batch_b = root / "batch-b.wav"
              make_wav(batch_a)
              make_wav(batch_b)
              current_before_batch = player.current_media_id
              original_get_open_names = QFileDialog.getOpenFileNames
              original_choose_storage = music_tab._choose_storage_mode
              try:
                  QFileDialog.getOpenFileNames = staticmethod(
                      lambda *args, **kwargs: (
                          [str(batch_a), str(batch_b)],
                          "Аудио (*.mp3 *.wav *.ogg)",
                      )
                  )
                  music_tab._choose_storage_mode = (
                      lambda sources: MEDIA_STORAGE_EXTERNAL
                  )
                  music_tab._import_music()
              finally:
                  QFileDialog.getOpenFileNames = original_get_open_names
                  music_tab._choose_storage_mode = original_choose_storage
              external_music = [
                  asset
                  for asset in db.list_media_assets(MEDIA_CATEGORY_MUSIC)
                  if asset.storage_mode == MEDIA_STORAGE_EXTERNAL
              ]
              batch_names = {Path(asset.external_path).name for asset in external_music}
              assert {"batch-a.wav", "batch-b.wav"}.issubset(batch_names)
              assert player.current_media_id == current_before_batch

              # Filename-only duplicate rule is evaluated after storage choice.
              # Managed -> External: do not create a second row; for one
              # collision reveal/select the existing track without changing
              # playback.
              managed_a = next(
                  asset for asset in db.list_media_assets(MEDIA_CATEGORY_MUSIC)
                  if asset.storage_mode == MEDIA_STORAGE_MANAGED
                  and asset.managed_name.casefold() == "a track.wav"
              )
              managed_b = next(
                  asset for asset in db.list_media_assets(MEDIA_CATEGORY_MUSIC)
                  if asset.storage_mode == MEDIA_STORAGE_MANAGED
                  and asset.managed_name.casefold() == "b track.wav"
              )
              same_name_dir = root / "same-name-source"
              same_name_source = same_name_dir / "A track.wav"
              same_name_b = same_name_dir / "B track.wav"
              make_wav(same_name_source, seconds=0.25)
              make_wav(same_name_b, seconds=0.25)
              count_before_duplicate = len(db.list_media_assets(MEDIA_CATEGORY_MUSIC))
              current_before_duplicate = player.current_media_id
              music_tab.search.setText("no-visible-results")
              original_get_open_names = QFileDialog.getOpenFileNames
              original_choose_storage = music_tab._choose_storage_mode
              original_information = QMessageBox.information
              single_messages = []
              try:
                  QFileDialog.getOpenFileNames = staticmethod(
                      lambda *args, **kwargs: (
                          [str(same_name_source)],
                          "Аудио (*.mp3 *.wav *.ogg)",
                      )
                  )
                  music_tab._choose_storage_mode = (
                      lambda sources: MEDIA_STORAGE_EXTERNAL
                  )
                  QMessageBox.information = staticmethod(
                      lambda *args, **kwargs: (
                          single_messages.append(str(args[2]))
                          or QMessageBox.StandardButton.Ok
                      )
                  )
                  music_tab._import_music()
              finally:
                  QFileDialog.getOpenFileNames = original_get_open_names
                  music_tab._choose_storage_mode = original_choose_storage
                  QMessageBox.information = original_information
              assert len(db.list_media_assets(MEDIA_CATEGORY_MUSIC)) == count_before_duplicate
              assert music_tab.search.text() == ""
              selected_row = music_tab.list_widget.currentItem()
              assert selected_row is not None
              assert int(selected_row.data(Qt.UserRole)) == int(managed_a.id)
              assert player.current_media_id == current_before_duplicate
              assert single_messages and "уже есть в библиотеке" in single_messages[-1]

              # Several filename collisions only produce one informational
              # warning. They must not search, scroll to or select any of the
              # duplicate rows.
              music_tab.search.setText("A track")
              music_tab._select_library_asset(managed_a.id)
              music_tab.search.setText("A track")
              selected_before_multiple = int(
                  music_tab.list_widget.currentItem().data(Qt.UserRole)
              )
              count_before_multiple = len(db.list_media_assets(MEDIA_CATEGORY_MUSIC))
              multiple_messages = []
              original_get_open_names = QFileDialog.getOpenFileNames
              original_choose_storage = music_tab._choose_storage_mode
              original_information = QMessageBox.information
              try:
                  QFileDialog.getOpenFileNames = staticmethod(
                      lambda *args, **kwargs: (
                          [str(same_name_source), str(same_name_b)],
                          "Аудио (*.mp3 *.wav *.ogg)",
                      )
                  )
                  music_tab._choose_storage_mode = (
                      lambda sources: MEDIA_STORAGE_EXTERNAL
                  )
                  QMessageBox.information = staticmethod(
                      lambda *args, **kwargs: (
                          multiple_messages.append(str(args[2]))
                          or QMessageBox.StandardButton.Ok
                      )
                  )
                  music_tab._import_music()
              finally:
                  QFileDialog.getOpenFileNames = original_get_open_names
                  music_tab._choose_storage_mode = original_choose_storage
                  QMessageBox.information = original_information
              assert len(db.list_media_assets(MEDIA_CATEGORY_MUSIC)) == count_before_multiple
              assert music_tab.search.text() == "A track"
              assert int(music_tab.list_widget.currentItem().data(Qt.UserRole)) == selected_before_multiple
              assert multiple_messages
              assert "A track.wav" in multiple_messages[-1]
              assert "B track.wav" in multiple_messages[-1]
              assert "Уже есть в библиотеке" in multiple_messages[-1]
              assert player.current_media_id == current_before_duplicate

              # External -> Managed: copy the file into data\music and promote
              # the existing DB row in place. ID/count/queue identity stay
              # stable instead of creating a duplicate.
              promote_source = root / "promote-me.wav"
              make_wav(promote_source, seconds=0.2)
              external_to_promote = db.register_external_media_asset(
                  MEDIA_CATEGORY_MUSIC,
                  promote_source,
              )
              player.refresh_library()
              promote_id = int(external_to_promote.id)
              count_before_promote = len(db.list_media_assets(MEDIA_CATEGORY_MUSIC))
              current_before_promote = player.current_media_id
              promote_target = music_dir / promote_source.name
              if promote_target.exists():
                  promote_target.unlink()
              original_get_open_names = QFileDialog.getOpenFileNames
              original_choose_storage = music_tab._choose_storage_mode
              try:
                  QFileDialog.getOpenFileNames = staticmethod(
                      lambda *args, **kwargs: (
                          [str(promote_source)],
                          "Аудио (*.mp3 *.wav *.ogg)",
                      )
                  )
                  music_tab._choose_storage_mode = (
                      lambda sources: MEDIA_STORAGE_MANAGED
                  )
                  music_tab._import_music()
              finally:
                  QFileDialog.getOpenFileNames = original_get_open_names
                  music_tab._choose_storage_mode = original_choose_storage
              promoted = db.get_media_asset(promote_id)
              assert promoted is not None
              assert promoted.id == promote_id
              assert promoted.storage_mode == MEDIA_STORAGE_MANAGED
              assert promoted.managed_name == promote_source.name
              assert promoted.external_path == ""
              assert promote_target.exists()
              assert len(db.list_media_assets(MEDIA_CATEGORY_MUSIC)) == count_before_promote
              assert promote_id in player.queue
              assert player.current_media_id == current_before_promote

              assert stream_tab.music_player_show_mode.count() == 3
              assert stream_tab.music_player_animation.count() == 2

              # D26 manual-gate UX: only settings that can affect the selected
              # presentation mode stay visible.
              stream_tab.music_player_show_mode.setCurrentIndex(
                  stream_tab.music_player_show_mode.findData("hidden")
              )
              stream_tab._update_music_player_overlay_enabled_state()
              assert stream_tab.music_player_duration_seconds_control.isHidden()
              assert stream_tab.music_player_animation.isHidden()
              assert stream_tab.music_player_direction.isHidden()

              stream_tab.music_player_show_mode.setCurrentIndex(
                  stream_tab.music_player_show_mode.findData("track_change")
              )
              stream_tab.music_player_animation.setCurrentIndex(
                  stream_tab.music_player_animation.findData("fade")
              )
              stream_tab._update_music_player_overlay_enabled_state()
              assert not stream_tab.music_player_duration_seconds_control.isHidden()
              assert not stream_tab.music_player_animation.isHidden()
              assert stream_tab.music_player_direction.isHidden()

              stream_tab.music_player_animation.setCurrentIndex(
                  stream_tab.music_player_animation.findData("slide")
              )
              stream_tab._update_music_player_overlay_enabled_state()
              assert not stream_tab.music_player_direction.isHidden()

              stream_tab.music_player_show_mode.setCurrentIndex(
                  stream_tab.music_player_show_mode.findData("always")
              )
              stream_tab._update_music_player_overlay_enabled_state()
              assert stream_tab.music_player_duration_seconds_control.isHidden()
              assert not stream_tab.music_player_animation.isHidden()
              assert not stream_tab.music_player_direction.isHidden()

              stream_tab.music_player_auto_colors.setChecked(True)
              stream_tab.music_player_background_color_mode.setChecked(True)
              stream_tab._update_music_player_overlay_enabled_state()
              assert stream_tab.music_player_background_color_row.isHidden()
              assert stream_tab.music_player_frame_color_row.isHidden()
              assert not stream_tab.music_player_spectrum_color_row.isHidden()

              stream_tab.music_player_auto_colors.setChecked(False)
              stream_tab._update_music_player_overlay_enabled_state()
              assert not stream_tab.music_player_background_color_row.isHidden()
              assert not stream_tab.music_player_frame_color_row.isHidden()

              api.start()
              try:
                  base = f"http://127.0.0.1:{port}"
                  with urllib.request.urlopen(base + "/api/music-player", timeout=5) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  assert "state" in payload and "appearance" in payload
                  assert payload["appearance"]["show_mode"] in {"hidden", "track_change", "always"}

                  with urllib.request.urlopen(base + "/music-player-overlay", timeout=5) as response:
                      overlay = response.read().decode("utf-8")
                  assert "createAnalyser" in overlay
                  assert "object-fit:cover" in overlay
                  assert "marquee" in overlay
                  assert 'left:1.2vw' in overlay
                  assert 'border-radius:1.1vw' in overlay
                  assert 'id="musicFallback"' in overlay
                  assert 'const demo=preview && !currentState.playing' in overlay
                  assert 'padding:.08em .30em .10em' in overlay
                  assert '-webkit-text-stroke:.034em' in overlay
                  assert 'startAudioSync(currentState)' in overlay
                  assert 'withTimeout(audio.play(),1000)' in overlay
                  assert overlay.index('evaluateVisibility(currentState,lastEventSerial<0)') < overlay.index('startAudioSync(currentState)')
                  assert 'if(!audible && gainNode) audio.muted=false' in overlay
                  assert 'Включите музыку в плеере и нажмите на предпросмотр, чтобы увидеть анимацию.' in overlay
                  assert 'analysisTransportReady' in overlay
                  assert 'preview ? (!playing || required) : (playing && required)' in overlay
                  assert 'spectrumUnlock.addEventListener("click",(event)=>' in overlay
                  assert 'if(preview) card.style.pointerEvents="auto"' in overlay

                  with urllib.request.urlopen(base + "/music-placeholder", timeout=5) as response:
                      placeholder = response.read()
                  assert b"<svg" in placeholder and b"Music note" in placeholder
              finally:
                  api.stop()

              player.stop()
              app.processEvents()

              # STOP keeps the logical current track but must unload the
              # native media source so the normal Windows event loop can release
              # its filesystem handle.
              player.stop()
              app.processEvents()
              assert player.player.source().isEmpty()

              # Managed D26 audio folders are authoritative; verify pruning on
              # a different never-loaded track so the filesystem assertion is
              # independent from multimedia-backend release timing.
              removable = next(a for a in music_assets if a.id != first.id)
              removed_id = removable.id
              (music_dir / removable.managed_name).unlink()
              player.refresh_library()
              assert db.get_media_asset(removed_id) is None

              player.shutdown()
              music_tab.deleteLater()
              stream_tab.deleteLater()

              # Re-open a real saved position: startup must restore the
              # pending seek without overwriting it with QMediaPlayer's
              # temporary 0 ms and must never auto-play.
              db.set_setting(MUSIC_PLAYER_CURRENT_MEDIA_ID_KEY, str(first.id))
              db.set_setting(MUSIC_PLAYER_POSITION_MS_KEY, "73")
              second = MusicPlayerController(db, AudioCoordinator())
              assert second.desired_state == PLAYER_PAUSE
              assert db.get_setting(MUSIC_PLAYER_POSITION_MS_KEY, "") == "73"
              second.shutdown()
              second.deleteLater()
              app.processEvents()

              # A missing saved track is skipped to the next available file at
              # 00:00 rather than inheriting the missing track's old position.
              db.set_setting(MUSIC_PLAYER_CURRENT_MEDIA_ID_KEY, str(removed_id))
              db.set_setting(MUSIC_PLAYER_POSITION_MS_KEY, "99")
              third = MusicPlayerController(db, AudioCoordinator())
              assert third.desired_state == PLAYER_PAUSE
              assert third.current_media_id == first.id
              assert db.get_setting(MUSIC_PLAYER_POSITION_MS_KEY, "") == "0"
              third.shutdown()
              third.deleteLater()
              app.processEvents()

          print("D26 SEMANTIC SMOKE: PASS")
          '@ | Set-Content -Encoding utf8 d26_semantic_smoke.py
          python d26_semantic_smoke.py

