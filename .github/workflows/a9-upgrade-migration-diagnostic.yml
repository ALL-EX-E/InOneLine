name: A9 Upgrade Migration Diagnostic

on:
  push:
    branches:
      - maintenance/a9-installer-user-state
    paths:
      - ".github/workflows/a9-upgrade-migration-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upgrade-migration:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Install exact Python runtime dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build-lock.txt

      - name: Download official accepted maintenance installer
        shell: pwsh
        run: |
          $url = "https://github.com/ALL-EX-E/InOneLine/releases/download/v1.0.8-maintenance-2026-10-01/InOneLine_1.0.8_MAINTENANCE_FINAL.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\accepted.exe"
          $sha = (Get-FileHash "$env:RUNNER_TEMP\accepted.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "2b469e334480d5073a15f48c0e0d84ce3926b990dd4e415c4c90ff0885ba28f1") {
            throw "Accepted maintenance installer hash mismatch: $sha"
          }

      - name: Install official accepted maintenance baseline
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP\A9UpgradeInstall"
          Remove-Item $install -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\accepted.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Accepted baseline install failed: $($p.ExitCode)" }
          if (!(Test-Path "$install\InOneLine.exe")) { throw "Accepted baseline EXE missing" }

      - name: Seed exact legacy production QSettings
        shell: pwsh
        run: |
          @'
          from PySide6.QtCore import QSettings
          s = QSettings(
              QSettings.Format.NativeFormat,
              QSettings.Scope.UserScope,
              "Local Streaming Tools",
              "Streaming Manager",
          )
          s.clear()
          s.setValue("main_window/tab_index", 3)
          s.setValue("main_window/maximized", False)
          s.setValue("lists/visible", False)
          s.setValue("games/list_visible", False)
          s.setValue("public/list_visible", False)
          s.sync()
          assert s.status() == QSettings.Status.NoError
          assert s.value("main_window/tab_index", -1, type=int) == 3
          assert s.value("lists/visible", True, type=bool) is False
          print("LEGACY_QSETTINGS_SEEDED=PASS")
          '@ | Set-Content "$env:RUNNER_TEMP\seed_legacy.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\seed_legacy.py"

      - name: Download exact A9 candidate artifact
        shell: pwsh
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/11210430783/zip"
          curl.exe -L `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            $uri -o "$env:RUNNER_TEMP\a9.zip"
          if ($LASTEXITCODE -ne 0) { throw "Candidate artifact download failed" }
          Expand-Archive "$env:RUNNER_TEMP\a9.zip" -DestinationPath "$env:RUNNER_TEMP\a9" -Force
          $candidate = "$env:RUNNER_TEMP\a9\InOneLine_1.0.8_A9_INSTALLER_USER_STATE_CANDIDATE.exe"
          if (!(Test-Path $candidate)) { throw "Candidate installer missing" }
          $sha = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "b91c6911834ecec8ce5bad060ce9babead462592da992a466817cbe2b6bc1986") {
            throw "Candidate installer hash mismatch: $sha"
          }

      - name: Upgrade accepted install with A9 candidate
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP\A9UpgradeInstall"
          $candidate = "$env:RUNNER_TEMP\a9\InOneLine_1.0.8_A9_INSTALLER_USER_STATE_CANDIDATE.exe"
          $p = Start-Process -FilePath $candidate -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "A9 upgrade install failed: $($p.ExitCode)" }
          if (Test-Path "$install\data\ui_state.ini") {
            throw "Upgrade installer itself created ui_state.ini"
          }

      - name: Verify legacy Registry survived the installer upgrade
        shell: pwsh
        run: |
          @'
          from PySide6.QtCore import QSettings
          s = QSettings(
              QSettings.Format.NativeFormat,
              QSettings.Scope.UserScope,
              "Local Streaming Tools",
              "Streaming Manager",
          )
          assert s.value("main_window/tab_index", -1, type=int) == 3, s.allKeys()
          assert s.value("lists/visible", True, type=bool) is False
          print("LEGACY_QSETTINGS_AFTER_INSTALL=PASS")
          '@ | Set-Content "$env:RUNNER_TEMP\check_legacy.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\check_legacy.py"

      - name: Start upgraded A9 once
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP\A9UpgradeInstall"
          $proc = Start-Process -FilePath "$install\InOneLine.exe" -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "A9 upgraded app did not start" }
            Start-Sleep -Seconds 2
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Verify migrated file and cleared legacy Registry
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from PySide6.QtCore import QSettings

          install = Path(os.environ["RUNNER_TEMP"]) / "A9UpgradeInstall"
          ini_path = install / "data" / "ui_state.ini"
          assert ini_path.is_file(), ini_path

          ini = QSettings(str(ini_path), QSettings.Format.IniFormat)
          assert ini.value("main_window/tab_index", -1, type=int) == 3, ini.allKeys()
          assert ini.value("lists/visible", True, type=bool) is False
          assert ini.value("games/list_visible", True, type=bool) is False
          assert ini.value("public/list_visible", True, type=bool) is False
          assert ini.value("migration/native_qsettings_v1", False, type=bool) is True

          legacy = QSettings(
              QSettings.Format.NativeFormat,
              QSettings.Scope.UserScope,
              "Local Streaming Tools",
              "Streaming Manager",
          )
          assert legacy.allKeys() == [], legacy.allKeys()
          print("A9_REAL_UPGRADE_MIGRATION=PASS")
          '@ | Set-Content "$env:RUNNER_TEMP\check_migrated.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\check_migrated.py"
