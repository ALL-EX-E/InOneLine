name: Candidate 1.0.5 D43 timer audio transport

on:
  push:
    branches:
      - candidate/1.0.5-d43

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and D43 source regression gate
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          python .github/candidate_d43_smoke.py

      - name: Static D43 invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from streaming_manager.constants import (
              APP_VERSION,
              AUCTION_AUDIO_OUTPUT_MODE_DEFAULT,
              AUCTION_AUDIO_OUTPUT_MODE_APPLICATION,
              SCHEMA_VERSION,
          )

          assert APP_VERSION == "1.0.5"
          assert SCHEMA_VERSION == 18
          assert AUCTION_AUDIO_OUTPUT_MODE_DEFAULT == AUCTION_AUDIO_OUTPUT_MODE_APPLICATION

          schema = Path("streaming_manager/db/schema.py").read_text(encoding="utf-8")
          assert schema.count("self._run_migration(") == 14

          timer = Path("streaming_manager/web/timer_overlay.html").read_text(encoding="utf-8")
          assert 'id="auction-audio"' in timer
          assert "syncAuctionAudio" in timer
          assert 'const API = "/api/timer"' in timer

          audio = Path("streaming_manager/audio.py").read_text(encoding="utf-8")
          assert "class AudioCoordinator" in audio
          assert "set_transport_silent" in audio

          services = Path("streaming_manager/db/services.py").read_text(encoding="utf-8")
          assert '"audio": audio_payload' in services

          auction = Path("streaming_manager/views/auction.py").read_text(encoding="utf-8")
          assert "Через OBS Browser Source таймера" in auction

          print("D43 STATIC INVARIANTS: PASS")
          '@ | python -

      - name: Verify schema and RNG code unchanged from accepted 1.0.4 base
        shell: pwsh
        run: |
          git diff --exit-code 979ef506f78aac88d1f8af1feb69a3e46574b574 -- streaming_manager/db/schema.py streaming_manager/db/wheel.py streaming_manager/random_sources.py
          if ($LASTEXITCODE -ne 0) { throw "Schema/RNG protected files changed" }
          Write-Host "SCHEMA/RNG PROTECTED DIFF: PASS"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.5.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"
          if ($item.VersionInfo.FileVersion -notlike "1.0.5*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen timer-audio API smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.5.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.5") {
              throw "Wrong frozen version: $($health.version)"
            }
            $timer = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/timer" -TimeoutSec 2
            if ($null -eq $timer.audio) { throw "Frozen /api/timer has no D43 audio contract" }
            if ($timer.audio.enabled) { throw "Fresh install must default to application audio output" }
            $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8765/timer-overlay" -TimeoutSec 2).Content
            if ($html -notmatch 'id="auction-audio"') { throw "Frozen timer overlay has no audio element" }
            Write-Host "FROZEN INSTALL/START/API D43 SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Create candidate source snapshot
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\source"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Remove-Item "$stage\installer\output" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath "installer\output\InOneLine_CANDIDATE_1.0.5_D43_SOURCE.zip" -CompressionLevel Optimal

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.5.exe"
          $source = "installer\output\InOneLine_CANDIDATE_1.0.5_D43_SOURCE.zip"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setup).Length
          $sourceSize = (Get-Item $source).Length
          @"
          InOneLine 1.0.5 D43 timer audio transport candidate
          Branch: candidate/1.0.5-d43
          Commit: $env:GITHUB_SHA
          Schema: 18
          Named migrations: 14
          Installer: InOneLine_Setup_1.0.5.exe
          Installer bytes: $setupSize
          Installer SHA-256: $setupHash
          Source: InOneLine_CANDIDATE_1.0.5_D43_SOURCE.zip
          Source bytes: $sourceSize
          Source SHA-256: $sourceHash
          CURRENT 1.0.4 remains untouched pending manual acceptance.
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.5_D43_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.5.exe
            installer/output/InOneLine_CANDIDATE_1.0.5_D43_SOURCE.zip
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
