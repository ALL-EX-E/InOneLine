name: InOneLine PERF-02A Qt Worker Lifecycle (Windows)

on:
  push:
    branches:
      - audit/perf02-qt-lifecycle-20261031
    paths:
      - "app.py"
      - "streaming_manager/**"
      - "tools/perf02_worker_lifecycle_smoke.py"
      - "installer/**"
      - ".github/workflows/perf02-worker-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-02a-windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-lock.txt
          python -m pip check

      - name: Compile source and tools
        shell: pwsh
        run: |
          python -m compileall -q app.py streaming_manager tools
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }

      - name: PERF-02A deferred Qt jobs, cancellation and write integrity
        shell: pwsh
        run: |
          python -m tools.perf02_worker_lifecycle_smoke
          if ($LASTEXITCODE -ne 0) { throw "PERF-02A worker lifecycle failed" }

      - name: PERF-01 accepted shutdown and chat regression
        shell: pwsh
        run: |
          python -m tools.shutdown_lifecycle_smoke
          if ($LASTEXITCODE -ne 0) { throw "PERF-01 image/exit regression failed" }
          python -m tools.third_party_catalog_exit_smoke
          if ($LASTEXITCODE -ne 0) { throw "PERF-01 third-party emote regression failed" }
          python -m tools.multichat_core_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat core regression failed" }
          python -m tools.multichat_windows_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat Qt/API regression failed" }
          python -m tools.chat_appearance_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat draft/appearance regression failed" }
          python -m tools.chat_graphics_smoke
          if ($LASTEXITCODE -ne 0) { throw "Chat images regression failed" }
          python -m tools.chat_third_party_smoke
          if ($LASTEXITCODE -ne 0) { throw "Third-party catalog regression failed" }
          python -m tools.r06_list_smoke
          if ($LASTEXITCODE -ne 0) { throw "R06 list/chat regression failed" }

      - name: Full backup, restore and runtime filesystem safety
        shell: pwsh
        run: |
          python -m tools.full_backup_smoke
          if ($LASTEXITCODE -ne 0) { throw "Full backup regression failed" }
          python -m tools.full_restore_rollback_smoke
          if ($LASTEXITCODE -ne 0) { throw "Restore rollback regression failed" }
          python -m tools.legacy_full_backup_restore_smoke
          if ($LASTEXITCODE -ne 0) { throw "Legacy restore regression failed" }
          python -m tools.runtime_filesystem_cleanup_smoke
          if ($LASTEXITCODE -ne 0) { throw "Runtime filesystem regression failed" }

      - name: Existing comprehensive GUI, public/shared XLSX and data safety smoke
        shell: pwsh
        run: |
          python tools/gui_regression_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "GUI / XLSX regression failed" }

      - name: Build frozen app with accepted spec
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean installer/InOneLine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist/InOneLine/InOneLine.exe")) { throw "Frozen EXE missing" }

      - name: Frozen graceful exit and port release (no forced PASS)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python tools/graceful_frozen_exit_smoke.py "dist/InOneLine/InOneLine.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen exit gate failed" }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP/InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed" }
          if (!(Test-Path "$inno/ISCC.exe")) { throw "ISCC missing" }

      - name: Build candidate installer and SHA256
        shell: pwsh
        run: |
          $dist = (Resolve-Path "dist/InOneLine").Path
          & "$env:RUNNER_TEMP/InnoSetup710/ISCC.exe" "/DDistRoot=$dist" "installer/InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno build failed" }
          $setup = "installer/output/InOneLine_Setup_1.0.8.exe"
          if (!(Test-Path $setup)) { throw "Candidate missing" }
          $item = Get-Item $setup
          Write-Host "PERF02_INSTALLER_SIZE=$($item.Length)"
          Write-Host "PERF02_INSTALLER_SHA256=$((Get-FileHash $setup -Algorithm SHA256).Hash)"

      - name: Publish isolated QA installer
        uses: actions/upload-artifact@v4
        with:
          name: InOneLine_PERF02A_Workers_Candidate
          path: installer/output/InOneLine_Setup_1.0.8.exe
          retention-days: 14
          if-no-files-found: error
