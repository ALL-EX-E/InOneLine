name: Publish InOneLine 1.0.8 Maintenance 2026-10-01

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES_1.0.8_MAINTENANCE_2026-10-01.md

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_ARTIFACT_ID: "11162960419"
      ACCEPTED_TARGET_COMMIT: "9d31b4af1ea19c80f257be2fec2b660b3cc4aadb"
      RELEASE_TAG: "v1.0.8-maintenance-2026-10-01"
      EXPECTED_SETUP_SHA256: "2b469e334480d5073a15f48c0e0d84ce3926b990dd4e415c4c90ff0885ba28f1"
      EXPECTED_SOURCE_SHA256: "bba8214b87729517036f3d422d5e86b6d56b9f23738d396bd4069b4801429e83"

    steps:
      - uses: actions/checkout@v7

      - name: Download exact accepted maintenance artifact
        shell: pwsh
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ACCEPTED_ARTIFACT_ID/zip"
          curl.exe -L -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" $uri -o accepted-artifact.zip
          if (!(Test-Path accepted-artifact.zip)) { throw "Accepted maintenance artifact download missing" }
          Expand-Archive accepted-artifact.zip -DestinationPath accepted -Force

      - name: Verify exact accepted bytes
        shell: pwsh
        run: |
          $setup = "accepted\InOneLine_1.0.8_MAINTENANCE_CANDIDATE.exe"
          $source = "accepted\InOneLine_Source_1.0.8_MAINTENANCE_CANDIDATE.zip"
          $buildInfo = "accepted\BUILD_INFO.txt"
          if (!(Test-Path $setup)) { throw "Accepted maintenance installer missing" }
          if (!(Test-Path $source)) { throw "Accepted maintenance source missing" }
          if (!(Test-Path $buildInfo)) { throw "Accepted maintenance BUILD_INFO missing" }

          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne $env:EXPECTED_SETUP_SHA256) { throw "Installer SHA mismatch before publication: $setupHash" }
          if ($sourceHash -ne $env:EXPECTED_SOURCE_SHA256) { throw "Source SHA mismatch before publication: $sourceHash" }

          Copy-Item $setup "InOneLine_1.0.8_MAINTENANCE_FINAL.exe" -Force
          Copy-Item $source "InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip" -Force
          Copy-Item $buildInfo "InOneLine_1.0.8_MAINTENANCE_FINAL_BUILD_INFO.txt" -Force

          if ((Get-FileHash "InOneLine_1.0.8_MAINTENANCE_FINAL.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SETUP_SHA256) { throw "Installer changed while renaming" }
          if ((Get-FileHash "InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SOURCE_SHA256) { throw "Source changed while renaming" }
          Write-Host "ACCEPTED_MAINTENANCE_BYTES_VERIFY=PASS"

      - name: Publish maintenance release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "$env:RELEASE_TAG already exists; refusing to overwrite" }
          gh release create $env:RELEASE_TAG --repo "$env:GITHUB_REPOSITORY" --target "$env:ACCEPTED_TARGET_COMMIT" --title "InOneLine 1.0.8 Maintenance — 2026-10-01" --notes-file "RELEASE_NOTES_1.0.8_MAINTENANCE_2026-10-01.md" "InOneLine_1.0.8_MAINTENANCE_FINAL.exe#InOneLine_1.0.8_MAINTENANCE_FINAL.exe" "InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip#InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip" "InOneLine_1.0.8_MAINTENANCE_FINAL_BUILD_INFO.txt#InOneLine_1.0.8_MAINTENANCE_FINAL_BUILD_INFO.txt"

      - name: Verify published maintenance bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          gh release download $env:RELEASE_TAG --repo "$env:GITHUB_REPOSITORY" --dir verify --pattern "InOneLine_1.0.8_MAINTENANCE_FINAL.exe" --pattern "InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip"
          $setupHash = (Get-FileHash "verify\InOneLine_1.0.8_MAINTENANCE_FINAL.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash "verify\InOneLine_Source_1.0.8_MAINTENANCE_FINAL.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne $env:EXPECTED_SETUP_SHA256) { throw "Published installer SHA mismatch: $setupHash" }
          if ($sourceHash -ne $env:EXPECTED_SOURCE_SHA256) { throw "Published source SHA mismatch: $sourceHash" }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw "Maintenance release has incorrect draft/prerelease state" }
          Write-Host "MAINTENANCE_PUBLICATION_VERIFY=PASS"
