name: Publication wording gate

on:
  push:
  pull_request:

jobs:
  check-public-reference-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public reference wording
        run: python tools/check_public_reference_wording.py
