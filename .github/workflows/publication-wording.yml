name: Publication wording gate
# P05 post-merge wording verification trigger

on:
  push:
  pull_request:

jobs:
  check-public-reference-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check public reference wording
        run: python tools/check_public_reference_wording.py
