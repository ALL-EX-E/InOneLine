name: A8 Actions v7 validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/a8-actions-v7-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-actions-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create validation marker
        shell: bash
        run: |
          python --version
          printf 'A8_ACTIONS_V7_VALIDATION=PASS\n' > a8-actions-v7.txt

      - uses: actions/upload-artifact@v7
        with:
          name: a8-actions-v7-validation
          path: a8-actions-v7.txt
          if-no-files-found: error
          retention-days: 1
