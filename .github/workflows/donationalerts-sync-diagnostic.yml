name: DonationAlerts UI synchronization diagnostic (isolated Windows)

on:
  push:
    branches:
      - audit/operator-autotest-da-sync-20261101
      - fix/donationalerts-qt-refresh-20261101
    paths:
      - "tools/diagnostics/donationalerts_sync_probe.py"
      - "streaming_manager/donationalerts_runtime.py"
      - "streaming_manager/views/main_window.py"
      - ".github/workflows/donationalerts-sync-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-ui-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build-lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
      - name: Run synthetic DonationAlerts to Qt diagnostic
        shell: pwsh
        run: |
          python -m tools.diagnostics.donationalerts_sync_probe > "$env:RUNNER_TEMP/da_sync.json"
          $code = $LASTEXITCODE
          if (!(Test-Path "$env:RUNNER_TEMP/da_sync.json")) { throw "Diagnostic report absent" }
          $report = Get-Content "$env:RUNNER_TEMP/da_sync.json" -Raw | ConvertFrom-Json
          Write-Host "DA_SYNC_DIAGNOSTIC=$($report | ConvertTo-Json -Compress)"
          if ($report.db_transaction -ne "PASS") { throw "Synthetic DB pipeline failed" }
          if ($code -ne 0 -or $report.ui_auto_refresh -ne "PASS" -or $report.hidden_list_rows_after_open -ne 1 -or $report.log_event_visible_after_open -ne $true) {
            throw "DonationAlerts UI synchronization acceptance gate failed"
          }
          Write-Host "DA_SYNC_UI_REFRESH=PASS"
          Copy-Item "$env:RUNNER_TEMP/da_sync.json" "./da_sync_diagnostic.json"

      - name: Attach machine-readable diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DonationAlerts_synthetic_UI_diagnostic
          path: da_sync_diagnostic.json
          if-no-files-found: error
          retention-days: 14
