name: Sanitize published 1.0.4 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitize-source-1.0.4.yml"

permissions:
  contents: write

jobs:
  sanitize-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and sanitize published source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.4 --repo "${{ github.repository }}" --pattern "InOneLine_Source_1.0.4.zip"
          mkdir source
          unzip -q InOneLine_Source_1.0.4.zip -d source

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/streaming_manager/views/settings.py")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r"^        # Match the requested [A-Za-z0-9_.+-]+-style flow: a click in the app immediately$",
              "        # Match the requested quick-picker flow: a click in the app immediately",
              text,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one historical comparison comment, found {count}")
          path.write_text(text, encoding="utf-8")

          patterns = [
              re.compile(r"\bкак\s+в\s+[«\"'“]?[A-ZА-ЯЁ][A-Za-zА-Яа-яЁё0-9_.+-]*", re.I),
              re.compile(r"\bпо\s+аналогии\s+с\b", re.I),
              re.compile(r"\bпо\s+образцу\b", re.I),
              re.compile(r"\bв\s+стиле\s+[«\"'“]?[A-ZА-ЯЁ][A-Za-zА-Яа-яЁё0-9_.+-]*", re.I),
              re.compile(r"[A-Za-zА-Яа-яЁё0-9_.+]+[-‑–—]подобн\w*", re.I),
              re.compile(r"[A-Za-z0-9_.+]+[-‑–—]style\b", re.I),
              re.compile(r"\b(?:inspired\s+by|model(?:l)?ed\s+after|like\s+in)\b", re.I),
          ]
          suffixes={".md",".txt",".py",".html",".css",".js",".ts",".json",".yml",".yaml",".toml",".ini",".cfg",".iss",".bat",".cmd",".ps1"}
          hits=[]
          for item in Path("source").rglob("*"):
              if not item.is_file() or item.suffix.lower() not in suffixes:
                  continue
              try:
                  body=item.read_text(encoding="utf-8")
              except Exception:
                  continue
              for n,line in enumerate(body.splitlines(),1):
                  if any(p.search(line) for p in patterns):
                      hits.append(f"{item}:{n}: {line.strip()}")
          if hits:
              raise SystemExit("Remaining comparative wording:\n" + "\n".join(hits))
          PY

          rm InOneLine_Source_1.0.4.zip
          (cd source && zip -qr ../InOneLine_Source_1.0.4.zip .)
          SHA="$(sha256sum InOneLine_Source_1.0.4.zip | awk '{print $1}')"
          SIZE="$(stat -c %s InOneLine_Source_1.0.4.zip)"
          echo "NEW_SHA=$SHA" >> "$GITHUB_ENV"
          echo "NEW_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Replace public source asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset v1.0.4 InOneLine_Source_1.0.4.zip --repo "${{ github.repository }}" --yes
          gh release upload v1.0.4 InOneLine_Source_1.0.4.zip --repo "${{ github.repository }}" --clobber

      - name: Update public checksums and notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          new_sha=os.environ["NEW_SHA"]
          new_size=os.environ["NEW_SIZE"]
          old_sha="4e4f60bed84d428785bcf6f02f710dc001eb32a95c1f4fc09057597498e2f3a0"
          old_size="1299817"

          sums=Path("SHA256SUMS.txt")
          text=sums.read_text(encoding="utf-8")
          text=text.replace(old_sha, new_sha)
          sums.write_text(text, encoding="utf-8")

          notes=Path("RELEASE_NOTES_1.0.4.md")
          text=notes.read_text(encoding="utf-8")
          text=text.replace("### Exact accepted source snapshot", "### Published source snapshot")
          text=text.replace(f"- Размер: `{old_size}` байт", f"- Размер: `{new_size}` байт")
          text=text.replace(f"- SHA-256: `{old_sha}`", f"- SHA-256: `{new_sha}`")
          old=(
              "SOURCE — это exact source ZIP из принятого Windows artifact run `36406158610`. "
              "При публикации файл только переименован из candidate-имени в `InOneLine_Source_1.0.4.zip`; "
              "его байты не менялись. Служебные candidate-QA файлы и более поздние release-метаданные "
              "в официальный SOURCE ZIP не входят."
          )
          new=(
              "Опубликованный SOURCE основан на принятом исходном снимке 1.0.4. После релиза архив был "
              "перепакован только для нейтрализации одного комментария, описывавшего сторонний продукт "
              "как референс интерфейса. Runtime-логика, данные, schema/migrations и installer не изменялись."
          )
          if old not in text:
              raise SystemExit("Expected source provenance paragraph not found")
          text=text.replace(old,new)
          notes.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt RELEASE_NOTES_1.0.4.md
          git diff --cached --check
          git commit -m "Update sanitized 1.0.4 source metadata"
          git push origin HEAD:main

      - name: Sync release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.4 --repo "${{ github.repository }}" --notes-file RELEASE_NOTES_1.0.4.md
