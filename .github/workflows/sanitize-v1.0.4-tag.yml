name: Sanitize historical public tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitize-v1.0.4-tag.yml"

permissions:
  contents: write

jobs:
  sanitize-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create wording-only historical commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach v1.0.4
          python - <<'PY'
          from pathlib import Path
          import re

          notes = Path("RELEASE_NOTES_1.0.4.md")
          text = notes.read_text(encoding="utf-8")
          text = re.sub(
              r"^- [A-Za-z0-9_.+-]+-подобный quick picker;$",
              "- быстрый выбор изображения;",
              text,
              flags=re.MULTILINE,
          )
          notes.write_text(text, encoding="utf-8")

          settings = Path("streaming_manager/views/settings.py")
          text = settings.read_text(encoding="utf-8")
          text = re.sub(
              r"^        # Match the requested [A-Za-z0-9_.+-]+-style flow: a click in the app immediately$",
              "        # Match the requested quick-picker flow: a click in the app immediately",
              text,
              flags=re.MULTILINE,
          )
          settings.write_text(text, encoding="utf-8")
          PY
          git add RELEASE_NOTES_1.0.4.md streaming_manager/views/settings.py
          git diff --cached --check
          git commit -m "Use neutral wording in historical 1.0.4 sources"
          git tag -f v1.0.4 HEAD
          git push origin refs/tags/v1.0.4 --force
