name: InOneLine Operator AutoTest v1 (Windows)

on:
  push:
    branches:
      - audit/operator-autotest-v1-20261031
    paths:
      - "app.py"
      - "streaming_manager/operator_autotest.py"
      - "installer/InOneLine.spec"
      - "tools/operator_autotest/**"
      - ".github/workflows/operator-autotest-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autotest-v1:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip dependencies failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }

      - name: Source compile and isolated donation / Qt smoke
        shell: pwsh
        run: |
          python -m compileall -q app.py streaming_manager tools
          if ($LASTEXITCODE -ne 0) { throw 'Source compile failed' }
          python app.py --autotest-sandbox "$env:RUNNER_TEMP/operator_source.json"
          $code = $LASTEXITCODE
          if (!(Test-Path "$env:RUNNER_TEMP/operator_source.json")) { throw 'Sandbox JSON absent' }
          $j = Get-Content "$env:RUNNER_TEMP/operator_source.json" -Raw | ConvertFrom-Json
          $j.tests | ForEach-Object { Write-Host ("AUTOTEST_SOURCE {0} {1} {2}" -f $_.status,$_.name,$_.error_type) }
          if ($code -ne 0 -or $j.summary.fail -ne 0 -or $j.summary.pass -lt 6) { throw 'Source sandbox test failed' }

      - name: PowerShell 5.1 operator script parser
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/operator_autotest/InOneLine_AutoTest.ps1").Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("PS_PARSE_ERROR: " + $_.Message) }
            throw "Operator PS1 syntax invalid"
          }
          Write-Host "OPERATOR_PS5_PARSE=PASS"

      - name: Retained accepted PERF-02 and PERF-01 regressions
        shell: pwsh
        run: |
          python -m tools.perf02_worker_lifecycle_smoke
          if ($LASTEXITCODE -ne 0) { throw 'PERF02 regression failed' }
          python -m tools.third_party_catalog_exit_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Twitch exit regression failed' }
          python -m tools.chat_appearance_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Chat appearance regression failed' }
          python -m tools.full_backup_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Backup regression failed' }

      - name: Native UI and XLSX regression
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python tools/gui_regression_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI and XLSX regression failed' }

      - name: Frozen onedir build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean installer/InOneLine.spec
          if ($LASTEXITCODE -ne 0) { throw 'Frozen build failed' }

      - name: Real frozen --autotest-sandbox
        shell: pwsh
        run: |
          $result = "$env:RUNNER_TEMP/operator_frozen.json"
          & "dist/InOneLine/InOneLine.exe" --autotest-sandbox "$result"
          $code = $LASTEXITCODE
          if (!(Test-Path $result)) { throw 'Frozen sandbox JSON absent' }
          $j = Get-Content $result -Raw | ConvertFrom-Json
          $j.tests | ForEach-Object { Write-Host ("AUTOTEST_FROZEN {0} {1} {2}" -f $_.status,$_.name,$_.error_type) }
          if ($code -ne 0 -or $j.summary.fail -ne 0 -or $j.summary.pass -lt 6) { throw 'Frozen sandbox test failed' }

      - name: Real Windows normal close without forced success
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python tools/graceful_frozen_exit_smoke.py "dist/InOneLine/InOneLine.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Graceful frozen exit failed' }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP/InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Inno Setup install failed' }

      - name: Build installer and package scripts
        shell: pwsh
        run: |
          $dist = (Resolve-Path "dist/InOneLine").Path
          & "$env:RUNNER_TEMP/InnoSetup710/ISCC.exe" "/DDistRoot=$dist" "installer/InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $folder = "operator-autotest-output"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item "installer/output/InOneLine_Setup_1.0.8.exe" $folder
          Copy-Item "tools/operator_autotest/Start_InOneLine_AutoTest.cmd" $folder
          Copy-Item "tools/operator_autotest/InOneLine_AutoTest.ps1" $folder
          Copy-Item "tools/operator_autotest/README_RU.txt" $folder
          Get-ChildItem $folder | ForEach-Object { Write-Host ("OPERATOR_PACKAGE {0} {1}" -f $_.Name, $_.Length) }
          Write-Host ("OPERATOR_SETUP_SHA256=" + (Get-FileHash "$folder/InOneLine_Setup_1.0.8.exe" -Algorithm SHA256).Hash)

      - name: Upload installer and runnable CMD / PowerShell scripts
        uses: actions/upload-artifact@v4
        with:
          name: InOneLine_Operator_AutoTest_v1_Windows
          path: operator-autotest-output/*
          retention-days: 14
          if-no-files-found: error
