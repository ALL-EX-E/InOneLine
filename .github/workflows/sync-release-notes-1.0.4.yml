name: Sync release notes 1.0.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-release-notes-1.0.4.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release description from repository notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.4 --notes-file RELEASE_NOTES_1.0.4.md
