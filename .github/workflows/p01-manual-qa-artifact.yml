name: P01 Windows Manual QA Artifact
# trigger build after workflow exists on branch

on:
  push:
    branches:
      - qa/p01-windows-artifact
  pull_request:
    branches:
      - candidate/p01-mainwindow-shell-cleanup

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Install exact accepted dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-lock.txt
          python -m pip check

      - name: Verify P01 runtime source is unchanged from tested candidate
        shell: pwsh
        run: |
          git diff --exit-code 4dfd487f700ab1c1cd456df9ee9d34dcf582397c -- streaming_manager app.py installer requirements.txt requirements-build-lock.txt tools
          if ($LASTEXITCODE -ne 0) { throw "P01 runtime/test source differs from tested candidate" }

      - name: Build frozen application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) { throw "Frozen EXE missing" }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build candidate installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

          $setup = "installer\output\InOneLine_Setup_1.0.8.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "P01_SETUP_BYTES=$($item.Length)"
          Write-Host "P01_SETUP_SHA256=$hash"

          @"
          InOneLine 1.0.8 P01 manual QA candidate
          Runtime candidate commit: 4dfd487f700ab1c1cd456df9ee9d34dcf582397c
          Artifact branch commit: $env:GITHUB_SHA
          Automated regression: 37582729729 SUCCESS
          Installer: InOneLine_Setup_1.0.8.exe
          Installer bytes: $($item.Length)
          Installer SHA-256: $hash
          P01 remains unaccepted pending user manual QA.
          "@ | Set-Content -Encoding UTF8 "installer\output\P01_CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: InOneLine_1.0.8_P01_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.8.exe
            installer/output/P01_CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
