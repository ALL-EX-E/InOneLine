name: Candidate 1.0.2 Windows build

on:
  push:
    branches:
      - candidate/1.0.2-unified-obs-help

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and unified OBS help source gate
        shell: pwsh
        run: |
          python -m compileall -q streaming_manager app.py
          @'
          import os
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          sys.path.insert(0, os.getcwd())

          from PySide6.QtWidgets import QApplication, QMessageBox, QPushButton
          from streaming_manager.app_paths import AppPaths
          from streaming_manager.constants import APP_VERSION, SCHEMA_VERSION
          from streaming_manager.database import Database
          from streaming_manager.views.main_window import MainWindow

          assert APP_VERSION == "1.0.2", APP_VERSION
          assert SCHEMA_VERSION == 18, SCHEMA_VERSION

          source = Path("streaming_manager/views/stream.py").read_text(encoding="utf-8")
          assert 'QPushButton("Как добавить виджет в OBS")' in source
          assert 'QPushButton("Как добавить в OBS")' not in source
          assert "_show_timer_obs_help" not in source
          assert "_show_rules_obs_help" not in source
          assert "def _show_obs_widget_help" in source

          captured = []
          original_information = QMessageBox.information
          QMessageBox.information = staticmethod(
              lambda parent, title, message, *a, **k: captured.append((title, message)) or QMessageBox.Ok
          )

          app = QApplication.instance() or QApplication([])
          with TemporaryDirectory() as temp:
              paths = AppPaths.from_root(temp)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)
              db.set_setting("api_port", "18766")
              window = MainWindow(db, paths)
              try:
                  buttons = [b.text() for b in window.stream_tab.findChildren(QPushButton)]
                  assert buttons.count("Как добавить виджет в OBS") == 1, buttons
                  assert buttons.count("Как добавить в OBS") == 0, buttons

                  for expected in (
                      "Копировать URL оверлея",
                      "Копировать URL списка",
                      "Копировать URL таймера",
                      "Копировать URL списка лотов",
                      "Копировать URL правил",
                  ):
                      assert expected in buttons, expected

                  window.stream_tab._show_obs_widget_help()
                  assert len(captured) == 1, captured
                  title, message = captured[0]
                  assert title == "Как добавить виджет в OBS", title
                  assert "OBS → Источники → + → Браузер" in message
                  assert "Width / Height" in message
                  assert "Shutdown source when not visible" in message
                  assert "Refresh browser when scene becomes active" in message
                  assert "не обязательны" in message
                  print("UNIFIED OBS HELP SOURCE GATE: PASS")
              finally:
                  window.api.stop()
                  window.close()
                  app.processEvents()

          QMessageBox.information = original_information
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\candidate_102_smoke.py"
          python "$env:RUNNER_TEMP\candidate_102_smoke.py"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }
          if (!(Test-Path "dist\InOneLine\_internal\streaming_manager\web\auction_lots_overlay.html")) {
            throw "Auction lots overlay missing from frozen resources"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.2.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"
          if ($item.VersionInfo.FileVersion -notlike "1.0.2*") {
            throw "Wrong installer FileVersion: $($item.VersionInfo.FileVersion)"
          }

      - name: Silent install and frozen startup smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.2.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.2") { throw "Wrong frozen version: $($health.version)" }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/auction-lots-overlay" -TimeoutSec 5
            if ($page.Content -notmatch "/api/auction-lots") { throw "Auction lots page is wrong" }
            Write-Host "FROZEN INSTALL/START/API SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Write candidate build info
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.2.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          @"
          InOneLine 1.0.2 unified OBS help candidate
          Branch: candidate/1.0.2-unified-obs-help
          Commit: $env:GITHUB_SHA
          Installer: InOneLine_Setup_1.0.2.exe
          Bytes: $size
          SHA-256: $hash
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.2_UNIFIED_OBS_HELP_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.2.exe
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
