name: Candidate 1.0.1 Windows build

on:
  push:
    branches:
      - candidate/1.0.1-auction-lots-overlay

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Source GUI and API smoke
        shell: pwsh
        run: |
          @'
          import json
          import os
          import urllib.request
          import sys
          sys.path.insert(0, os.getcwd())
          from pathlib import Path
          from tempfile import TemporaryDirectory

          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")

          from PySide6.QtWidgets import QApplication, QMessageBox
          from streaming_manager.app_paths import AppPaths
          from streaming_manager.database import Database, Game
          from streaming_manager.views.main_window import MainWindow

          QMessageBox.information = staticmethod(lambda *a, **k: QMessageBox.Ok)
          QMessageBox.warning = staticmethod(lambda *a, **k: QMessageBox.Ok)
          QMessageBox.critical = staticmethod(lambda *a, **k: QMessageBox.Ok)

          app = QApplication.instance() or QApplication([])
          with TemporaryDirectory() as temp:
              paths = AppPaths.from_root(temp)
              paths.ensure_runtime_dirs()
              db = Database(paths.database_path)
              db.set_setting("api_port", "18765")
              db.add_game(Game(None, "Alpha", None, 100, status="not_played"))
              db.add_game(Game(None, "Beta", None, 50, status="played"))

              window = MainWindow(db, paths)
              try:
                  assert window.auction_tab.copy_timer_overlay_btn.text() == "Копировать URL таймера"
                  assert hasattr(window.stream_tab, "auction_lots_overlay_font")
                  assert hasattr(window.stream_tab, "auction_lots_background_combo")

                  weighted = window.auction_tab.mode_combo.findData("weighted_wheel")
                  assert weighted >= 0
                  window.auction_tab.mode_combo.setCurrentIndex(weighted)
                  window.auction_tab.wheel_chance_checkbox.setChecked(True)
                  window.auction_tab._set_desktop_lot_auto_scroll(True)
                  app.processEvents()

                  with urllib.request.urlopen(
                      "http://127.0.0.1:18765/api/auction-lots",
                      timeout=5,
                  ) as response:
                      payload = json.load(response)
                  assert payload["mode"] == "weighted_wheel"
                  assert payload["show_wheel_chance"] is True
                  assert payload["auto_scroll"] is True
                  assert [r["title"] for r in payload["rows"]] == ["Alpha", "Beta"]

                  window.auction_tab.wheel_chance_checkbox.setChecked(False)
                  app.processEvents()
                  with urllib.request.urlopen(
                      "http://127.0.0.1:18765/api/auction-lots",
                      timeout=5,
                  ) as response:
                      payload = json.load(response)
                  assert payload["show_wheel_chance"] is False

                  with urllib.request.urlopen(
                      "http://127.0.0.1:18765/auction-lots-overlay",
                      timeout=5,
                  ) as response:
                      page = response.read().decode("utf-8")
                  assert 'const API = "/api/auction-lots";' in page
                  print("SOURCE GUI/API SMOKE: PASS")
              finally:
                  window.api.stop()
                  window.close()
                  app.processEvents()
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\candidate_smoke.py"
          python "$env:RUNNER_TEMP\candidate_smoke.py"

      - name: Build PyInstaller application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/InOneLine.spec
          if (!(Test-Path "dist\InOneLine\InOneLine.exe")) {
            throw "PyInstaller output missing"
          }
          if (!(Test-Path "dist\InOneLine\_internal\streaming_manager\web\auction_lots_overlay.html")) {
            throw "Auction lots overlay missing from frozen resources"
          }

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $setup
          $inno = "$env:RUNNER_TEMP\InnoSetup710"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (!(Test-Path "$inno\ISCC.exe")) { throw "ISCC.exe missing" }
          & "$inno\ISCC.exe" /? | Select-Object -First 5

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "$env:RUNNER_TEMP\InnoSetup710\ISCC.exe"
          $dist = (Resolve-Path "dist\InOneLine").Path
          & $inno "/DDistRoot=$dist" "installer\InOneLine.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "installer\output\InOneLine_Setup_1.0.1.exe"
          if (!(Test-Path $setup)) { throw "Installer output missing" }
          $item = Get-Item $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = (Get-AuthenticodeSignature $setup).Status
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$hash"
          Write-Host "SETUP_FILEVERSION=$($item.VersionInfo.FileVersion)"
          Write-Host "SETUP_AUTHENTICODE=$sig"

      - name: Silent install and frozen startup smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\InOneLine_Setup_1.0.1.exe").Path
          $install = "$env:RUNNER_TEMP\InOneLineInstalled"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Candidate install failed: $($p.ExitCode)" }
          $exe = "$install\InOneLine.exe"
          if (!(Test-Path $exe)) { throw "Installed InOneLine.exe missing" }
          if (!(Test-Path "$install\_internal\streaming_manager\web\auction_lots_overlay.html")) {
            throw "Installed Auction lots overlay missing"
          }

          $proc = Start-Process -FilePath $exe -WorkingDirectory $install -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              } catch {}
            }
            if ($null -eq $health) { throw "Installed app API did not start" }
            if ($health.version -ne "1.0.1") { throw "Wrong frozen version: $($health.version)" }

            $lots = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/auction-lots" -TimeoutSec 5
            if ($null -eq $lots.rows) { throw "Auction lots API has no rows field" }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/auction-lots-overlay" -TimeoutSec 5
            if ($page.Content -notmatch "/api/auction-lots") { throw "Auction lots page is wrong" }
            Write-Host "FROZEN INSTALL/START/API SMOKE: PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Write candidate hashes
        shell: pwsh
        run: |
          $setup = "installer\output\InOneLine_Setup_1.0.1.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          @"
          InOneLine 1.0.1 candidate
          Branch: candidate/1.0.1-auction-lots-overlay
          Commit: $env:GITHUB_SHA
          Installer: InOneLine_Setup_1.0.1.exe
          Bytes: $size
          SHA-256: $hash
          "@ | Set-Content -Encoding UTF8 "installer\output\CANDIDATE_BUILD_INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: InOneLine_1.0.1_CANDIDATE_WINDOWS
          path: |
            installer/output/InOneLine_Setup_1.0.1.exe
            installer/output/CANDIDATE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
